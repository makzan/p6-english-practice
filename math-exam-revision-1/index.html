<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一段數學復習 練習</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 14px;
    font-family: "Arial Rounded MT Bold", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 35%, #84fab0 60%, #8fd3f4 100%);
    background-attachment: fixed; color: #263238;
  }
  h1 { text-align: center; font-size: clamp(1.3rem, 5vw, 2.1rem); color: #1b5e20; text-shadow: 2px 2px 0 #fff; margin: 6px 0 2px; }
  .sub { text-align: center; color: #2e7d32; margin: 0 0 14px; font-size: 1.05rem; }
  .card { background: #fff; border-radius: 26px; max-width: 760px; margin: 0 auto; padding: 20px 18px 24px; box-shadow: 0 10px 28px rgba(0,80,40,.22); border: 5px solid #ffd54f; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  a.homelink { display: inline-block; color: #2e7d32; font-weight: bold; text-decoration: none; margin: 0 auto 8px; }
  .topnav { text-align: center; margin-bottom: 4px; }
  /* fractions */
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .1em; font-size: .85em; line-height: 1.1; }
  .fr .fn { border-bottom: .09em solid currentColor; padding: 0 .18em .04em; }
  .fr .fd { padding: .04em .18em 0; }
  .num { white-space: nowrap; display: inline-flex; align-items: center; }
  .mw { margin-right: .04em; }
  .op { margin: 0 .12em; color: #d81b60; font-weight: bold; }
  .par { color: #6a1b9a; font-weight: bold; }
  /* home */
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 10px; }
  .topic { background: #f1f8e9; border-radius: 20px; padding: 18px 12px; font-size: 1.15rem; font-weight: bold; color: #1b5e20; box-shadow: 0 6px 0 #aed581; transition: transform .1s; }
  .topic .ti { font-size: 2.4rem; display: block; margin-bottom: 4px; }
  .topic .tc { display: block; font-size: .9rem; font-weight: normal; color: #558b2f; margin-top: 4px; }
  .topic:active { transform: translateY(4px); box-shadow: 0 2px 0 #aed581; }
  .topic.mix { background: #fff3e0; box-shadow: 0 6px 0 #ffb74d; color: #e65100; grid-column: 1 / -1; font-size: 1.45rem; }
  .topic.paper { background: #e3f2fd; box-shadow: 0 6px 0 #64b5f6; color: #0d47a1; }
  .topic.paper:active { box-shadow: 0 2px 0 #64b5f6; }
  .sec { margin: 18px 4px 6px; font-size: 1.05rem; color: #33691e; font-weight: bold; }
  .intro { font-size: 1.08rem; line-height: 1.7; background: #e8f5e9; border-radius: 16px; padding: 10px 14px; }
  /* quiz */
  .topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { background: #e8f5e9; border-radius: 999px; padding: 6px 12px; font-weight: bold; color: #1b5e20; font-size: 1rem; }
  .pill.star { background: #fff8e1; color: #f57f17; }
  .pill.fire { background: #fbe9e7; color: #d84315; }
  .homebtn { background: #eceff1; border-radius: 999px; padding: 6px 12px; font-size: 1rem; }
  .bar { flex: 1 1 100%; height: 14px; background: #e0e0e0; border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #66bb6a, #26c6da); transition: width .4s; }
  .tag { display: inline-block; background: #7e57c2; color: #fff; border-radius: 12px; padding: 4px 12px; font-size: .95rem; }
  .retry { display: inline-block; background: #ffca28; color: #6d4c00; border-radius: 12px; padding: 4px 10px; font-size: .9rem; margin-left: 6px; }
  .prompt { font-size: 1.25rem; margin: 12px 0 6px; line-height: 1.6; }
  .expr { font-size: clamp(1.8rem, 7.5vw, 2.8rem); font-weight: bold; text-align: center; margin: 10px 0; color: #0d47a1; line-height: 1.6; overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
  .figbox { text-align: center; margin: 8px 0; }
  svg.fig { width: min(360px, 92%); height: auto; max-height: 300px; }
  svg.fig .sh { fill: #9e9e9e; stroke: #212121; stroke-width: 2; stroke-linejoin: round; }
  svg.fig .un { fill: #fff; stroke: #212121; stroke-width: 2; stroke-linejoin: round; }
  svg.fig text { font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; }
  .hint { text-align: center; color: #6d4c41; background: #fff8e1; border-radius: 12px; padding: 6px 10px; margin: 6px auto; font-size: 1.05rem; max-width: 520px; }
  .mcq { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .mcq.one { grid-template-columns: 1fr; }
  .opt { background: #e3f2fd; color: #0d47a1; font-size: clamp(1.3rem, 5.5vw, 1.9rem); font-weight: bold; border-radius: 18px; padding: 16px 8px; min-height: 84px; box-shadow: 0 6px 0 #90caf9; }
  .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 #90caf9; }
  .opt.right { background: #c8e6c9; box-shadow: 0 6px 0 #66bb6a; color: #1b5e20; }
  .opt.wrong { background: #ffcdd2; box-shadow: 0 6px 0 #e57373; color: #b71c1c; }
  .opt:disabled { cursor: default; }
  .yn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  /* keypad / inputs */
  .ansrow { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px 0 4px; flex-wrap: wrap; }
  .kfrac { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .kline { width: 120px; height: 5px; background: #37474f; border-radius: 3px; }
  .kbox { min-width: 110px; height: 64px; border: 4px dashed #90a4ae; border-radius: 14px; font-size: 2rem; font-weight: bold; color: #0d47a1; background: #fafafa; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  .kbox.w { min-width: 90px; height: 80px; }
  .kbox.act { border: 4px solid #ff7043; background: #fff3e0; box-shadow: 0 0 0 4px rgba(255,112,67,.2); }
  .kbox:empty::after { content: attr(data-ph); color: #b0bec5; font-size: 1rem; font-weight: normal; }
  .nbox { min-width: 200px; height: 72px; border: 4px dashed #90a4ae; border-radius: 16px; font-size: 2.2rem; font-weight: bold; color: #0d47a1; background: #fafafa; display: flex; align-items: center; justify-content: center; padding: 0 12px; }
  .nbox.act { border: 4px solid #ff7043; background: #fff3e0; }
  .nbox:empty::after { content: attr(data-ph); color: #b0bec5; font-size: 1.1rem; font-weight: normal; }
  .unit { font-size: 1.6rem; font-weight: bold; color: #37474f; }
  .ktip { text-align: center; color: #78909c; font-size: .95rem; margin-bottom: 8px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 380px; margin: 0 auto; }
  .key { background: #ede7f6; color: #4527a0; font-size: 1.8rem; font-weight: bold; border-radius: 16px; padding: 12px 0; box-shadow: 0 5px 0 #b39ddb; }
  .key:active { transform: translateY(3px); box-shadow: 0 2px 0 #b39ddb; }
  .key.fn { background: #eceff1; color: #455a64; font-size: 1.25rem; box-shadow: 0 5px 0 #b0bec5; }
  .big { display: block; margin: 14px auto 0; font-size: 1.45rem; font-weight: bold; color: #fff; border-radius: 20px; padding: 14px 30px; min-width: 220px; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .submit { background: #43a047; }
  .next { background: #fb8c00; }
  .feedback { text-align: center; font-size: 1.35rem; font-weight: bold; margin-top: 12px; min-height: 1.5em; }
  .feedback.good { color: #2e7d32; }
  .feedback.bad { color: #c62828; }
  .feedback.info { color: #ef6c00; font-size: 1.15rem; }
  .why { background: #fff3e0; border-left: 6px solid #ff9800; border-radius: 10px; padding: 8px 12px; margin: 10px 0; font-size: 1.1rem; }
  .solution { background: #f3e5f5; border-radius: 16px; padding: 10px 14px; margin-top: 12px; }
  .solution h3 { margin: 4px 0 8px; color: #6a1b9a; font-size: 1.15rem; }
  .step { padding: 6px 0; border-bottom: 1px dashed #ce93d8; }
  .step:last-child { border-bottom: none; }
  .snote { color: #8e24aa; font-size: .98rem; }
  .shtml { font-size: 1.4rem; color: #263238; line-height: 1.8; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .sdetail { font-size: 1.15rem; color: #455a64; background: #fff; border-radius: 8px; padding: 2px 8px; display: inline-block; margin-top: 2px; line-height: 1.7; }
  .linkbtn { background: none; color: #6a1b9a; text-decoration: underline; font-size: 1.05rem; display: block; margin: 8px auto 0; }
  table.sum { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 1.05rem; }
  table.sum th, table.sum td { padding: 8px 6px; text-align: center; border-bottom: 2px solid #e0e0e0; }
  table.sum th { background: #e8f5e9; color: #1b5e20; }
  .bigemoji { font-size: 4rem; text-align: center; animation: bounce 1s infinite; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .row .big { margin: 10px 0 0; }
  .rtable { width: 100%; border-collapse: collapse; margin: 10px auto; font-size: 1.05rem; }
  .rtable th, .rtable td { border: 2px solid #90caf9; padding: 6px 4px; text-align: center; }
  .rtable th { background: #e3f2fd; color: #0d47a1; }
  .cell-in { min-width: 52px; min-height: 44px; border: 3px dashed #90a4ae; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem; background: #fafafa; color: #0d47a1; padding: 4px 6px; }
  .cell-in.act { border-color: #ff7043; background: #fff3e0; box-shadow: 0 0 0 3px rgba(255,112,67,.2); }
  .mlbtn { background: #fff3e0; color: #e65100; font-size: 1.6rem; font-weight: bold; border-radius: 16px; padding: 14px 8px; min-height: 72px; box-shadow: 0 5px 0 #ffcc80; }
  .mlbtn.act { background: #ffe0b2; box-shadow: 0 2px 0 #ffcc80; outline: 3px solid #ff7043; }
  .mlbtn.right { background: #c8e6c9; box-shadow: 0 5px 0 #66bb6a; color: #1b5e20; }
  .mlbtn.wrong { background: #ffcdd2; box-shadow: 0 5px 0 #e57373; color: #b71c1c; }
  .unitbtn { background: #e3f2fd; color: #0d47a1; font-size: 1.3rem; font-weight: bold; border-radius: 14px; padding: 12px 16px; box-shadow: 0 4px 0 #90caf9; }
  .unitbtn.act { background: #bbdefb; outline: 3px solid #ff7043; }
  .flab { font-size: 1.15rem; color: #455a64; }
  .colon { font-size: 2rem; font-weight: bold; color: #0d47a1; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .pop { animation: pop .3s ease; }
  .confetti { position: fixed; top: -30px; font-size: 1.7rem; pointer-events: none; animation: fall linear forwards; z-index: 99; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }
  @media (max-width: 420px) { .kbox { min-width: 90px; height: 56px; font-size: 1.7rem; } .key { font-size: 1.6rem; } .nbox { min-width: 160px; height: 64px; } }
</style>
</head>
<body>
<h1>🧮 第一段數學復習 📐</h1>
<div class="sub">比率、百分數、折扣賺賠、四則計算</div>

<div class="card" id="home">
  <div class="topnav"><a class="homelink" href="../">🏠 練習首頁</a></div>
  <div class="intro">
    👋 先溫習工作紙原題，再做同類新題，唔好死記答案！<br>
    ✅ 答啱有 ⭐，連續答啱有 🔥！<br>
    ❌ 答錯會睇到<b>逐步解法</b>，之後再出一條類似題畀你再試。
  </div>
  <div class="sec">📄 工作紙練習</div>
  <div class="topics" id="papers"></div>
  <div class="sec">🎯 專項練習（同類新題）</div>
  <div class="topics" id="topics"></div>
</div>

<div class="card hidden" id="quiz">
  <div class="topbar">
    <button class="homebtn" id="homeBtn">🏠 返回</button>
    <span class="pill" id="progTxt">1 / 15</span>
    <span class="pill star">⭐ <span id="stars">0</span></span>
    <span class="pill fire">🔥 <span id="streak">0</span></span>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div><span class="tag" id="tag"></span><span class="retry hidden" id="retryTag">🔁 再試類似題</span></div>
  <div class="prompt" id="prompt"></div>
  <div class="expr" id="expr"></div>
  <div class="figbox" id="figure"></div>
  <div class="hint hidden" id="hint"></div>

  <div class="mcq hidden" id="mcq"></div>
  <div class="yn hidden" id="yn"></div>
  <div class="hidden" id="mlrow"></div>

  <div class="hidden" id="keypad">
    <div class="ansrow" id="ansrow"></div>
    <div class="ktip" id="ktip">👆 撳格仔再撳數字。可以用小數點或分數。</div>
    <div class="keys" id="keys"></div>
    <button class="big submit" id="submitBtn">✔ 提交答案</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div id="why"></div>
  <button class="linkbtn hidden" id="showSolBtn">📖 睇解題步驟</button>
  <div class="solution hidden" id="solution"></div>
  <button class="big next hidden" id="nextBtn">下一題 ➡️</button>
</div>

<div class="card hidden" id="finish">
  <div class="bigemoji" id="finEmoji">🏆</div>
  <h2 style="text-align:center;color:#1b5e20;margin:6px 0" id="finTitle">完成！</h2>
  <p style="text-align:center;font-size:1.2rem" id="finSummary"></p>
  <table class="sum" id="sumTable"></table>
  <div class="row">
    <button class="big submit" id="againBtn">🔄 再玩一次</button>
    <button class="big next" id="backBtn">🏠 揀其他主題</button>
  </div>
</div>
<script>
(function () {
  "use strict";
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a || 1; }
  function fracH(n, d) { return '<span class="fr"><span class="fn">' + n + '</span><span class="fd">' + d + '</span></span>'; }
  function mixedH(w, n, d) { return '<span class="num">' + (w ? '<span class="mw">' + w + '</span>' : "") + fracH(n, d) + '</span>'; }
  function decStr(x) {
    if (typeof x === "number") {
      if (Number.isInteger(x)) return String(x);
      var s = x.toFixed(8).replace(/0+$/, "").replace(/\.$/, "");
      return s;
    }
    return String(x);
  }
  function nearly(a, b) { return Math.abs(a - b) < 1e-8 || Math.abs(a - b) <= 1e-6 * Math.max(1, Math.abs(b)); }
  function tidy(x) {
    if (typeof x !== "number" || !isFinite(x)) return x;
    var r = Math.round(x * 1e10) / 1e10;
    var places = [1, 10, 100, 1000, 10000, 100000];
    for (var i = 0; i < places.length; i++) {
      var d = Math.round(r * places[i]) / places[i];
      if (Math.abs(r - d) < 1e-8) return d;
    }
    return r;
  }

  function parseNum(s) {
    if (s == null) return null;
    s = String(s).trim().replace(/，/g, ".").replace(/／/g, "/").replace(/\s+/g, "").replace(/％/g, "%");
    if (!s) return null;
    var neg = 1;
    if (s.charAt(0) === "-") { neg = -1; s = s.slice(1); }
    s = s.replace(/%$/, "");
    // mixed 8 1/20 already stripped spaces... 81/20 would be wrong. mixed with leftover: 8+1/20 written as 8_1/20?
    var m = /^(\d+)[_+](\d+)\/(\d+)$/.exec(s);
    if (m) return neg * (+m[1] + +m[2] / +m[3]);
    if (s.indexOf("/") >= 0) {
      var p = s.split("/");
      if (p.length === 2 && p[0] !== "" && p[1] !== "" && +p[1] !== 0) return neg * (+p[0] / +p[1]);
      return null;
    }
    if (s === "." || s === "-.") return null;
    var v = Number(s);
    return isFinite(v) ? neg * v : null;
  }

  function uniquePush(arr, v) {
    if (v == null || !isFinite(v)) return;
    for (var i = 0; i < arr.length; i++) if (nearly(arr[i], v)) return;
    arr.push(v);
  }

  function makeMcq(correct, distractors, fmt, whys) {
    fmt = fmt || decStr;
    var opts = [{ html: fmt(correct), correct: true, why: "" }];
    (distractors || []).forEach(function (d, i) {
      if (d == null || (typeof d === "number" && nearly(d, correct))) return;
      var h = typeof d === "object" && d.html ? d.html : fmt(d);
      var already = opts.some(function (o) { return o.html === h; });
      if (already) return;
      opts.push({ html: h, correct: false, why: (typeof d === "object" && d.why) || (whys && whys[i]) || "" });
    });
    while (opts.length < 4) {
      var bump = typeof correct === "number" ? correct + (opts.length) : null;
      if (bump == null || opts.some(function (o) { return o.html === fmt(bump); })) break;
      opts.push({ html: fmt(bump), correct: false, why: "" });
    }
    return shuffle(opts.slice(0, 4));
  }

  // ---------- SVG ----------
  function svgPie(unPct) {
    var a = unPct / 100 * 2 * Math.PI;
    var x = 100 + 80 * Math.sin(a);
    var y = 100 - 80 * Math.cos(a);
    var large = unPct > 50 ? 1 : 0;
    var tx = 100 + 42 * Math.sin(a / 2);
    var ty = 100 - 42 * Math.cos(a / 2) + 6;
    return '<svg class="fig" viewBox="0 0 200 200" aria-label="圓圖，空白部分標示 ' + unPct + '%">' +
      '<circle class="sh" cx="100" cy="100" r="80"/>' +
      '<path class="un" d="M100,100 L100,20 A80,80 0 ' + large + ' 1 ' + x.toFixed(2) + ',' + y.toFixed(2) + ' Z"/>' +
      '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">' + unPct + '%</text></svg>';
  }

  function svgHex(num, den) {
    // rectangle + two side triangles; each triangle labelled num/den %
    var lab = '<tspan baseline-shift="super" font-size="11">' + num + '</tspan><tspan font-size="11">⁄</tspan><tspan baseline-shift="sub" font-size="11">' + den + '</tspan>';
    return '<svg class="fig" viewBox="0 0 300 170" aria-label="六邊形，中間長方形著色，兩側三角形各佔 ' + num + '/' + den + '%">' +
      '<polygon class="un" points="20,85 80,20 80,150"/>' +
      '<rect class="sh" x="80" y="20" width="140" height="130"/>' +
      '<polygon class="un" points="220,20 280,85 220,150"/>' +
      '<text x="48" y="80" text-anchor="middle" font-size="15" fill="#333">' + lab + '%</text>' +
      '<text x="252" y="80" text-anchor="middle" font-size="15" fill="#333">' + lab + '%</text></svg>';
  }

  function svgCornerTri(top, left, right) {
    return '<svg class="fig" viewBox="0 0 280 250" aria-label="大三角形，三個白角分別標 ' + top + '%、' + left + '%、' + right + '%">' +
      '<polygon class="un" points="140,18 20,230 260,230"/>' +
      '<polygon class="sh" points="140,78 88,200 192,200"/>' +
      '<line x1="92" y1="78" x2="188" y2="78" stroke="#212121" stroke-width="2"/>' +
      '<line x1="88" y1="200" x2="192" y2="200" stroke="#212121" stroke-width="2"/>' +
      '<text x="140" y="58" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">' + top + '%</text>' +
      '<text x="62" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">' + left + '%</text>' +
      '<text x="218" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">' + right + '%</text></svg>';
  }

  function svgGridTri(n, shadeUp) {
    if (shadeUp == null) shadeUp = true;
    var side = 220, h = side * Math.sqrt(3) / 2;
    var ox = 20, oy = 16;
    function pt(r, i) {
      var y = oy + h * r / n;
      var width = side * r / n;
      var x = ox + side / 2 - width / 2 + (r ? width * i / r : 0);
      return [x, y];
    }
    var parts = "", r, i, a, b, c;
    function poly(a, b, c, sh) {
      return '<polygon class="' + (sh ? "sh" : "un") + '" points="' +
        a[0].toFixed(2) + ',' + a[1].toFixed(2) + ' ' +

  function makeGenerated(id) {

    try { var o = BANK[id].original(); origKey = JSON.stringify({ p: o.prompt, e: o.expr, a: o.answerH }); } catch (e) { origKey = ""; }
    do {
      q = BANK[id].generate();
      tries++;
    } while (tries < 8 && origKey && JSON.stringify({ p: q.prompt, e: q.expr, a: q.answerH }) === origKey);
    q.skill = q.skill || id;
    q.source = "generated";

  function buildRound(groupKey) {
    var list = [], i, id;
    if (PAPERS[groupKey]) {
      var p = PAPERS[groupKey];
      for (i = 0; i < p.skills.length; i++) list.push(makeOriginal(p.skills[i]));
      var extras = shuffle(p.skills.slice()).slice(0, p.extra);
      for (i = 0; i < extras.length; i++) list.push(makeGenerated(extras[i]));
      return list;
    }
    if (groupKey === "mix") {
      var ids = shuffle(MIX_SKILLS.slice());
      for (i = 0; i < ids.length; i++) {
        list.push(Math.random() < 0.55 ? makeOriginal(ids[i]) : makeGenerated(ids[i]));
      }
      return list;
    }
    if (TOPICS[groupKey]) {
      var t = TOPICS[groupKey], count = 12;
      for (i = 0; i < count; i++) {
        id = t.skills[i % t.skills.length];
        if (i < t.skills.length) list.push(makeGenerated(id));
        else list.push(makeGenerated(pick(t.skills)));
      }
      return shuffle(list);
    }
    throw new Error("unknown group " + groupKey);
  }

  function checkAnswer(q) {
    if (q.kind === "moreless") {
      if (!input.ml) return { status: "invalid", msg: "請先揀「多」定「少」 🙂" };
      var v = EB.parseNum(input.raw);
      if (v == null) return { status: "invalid", msg: "請輸入百分數 ✏️" };
      var okML = input.ml === q.answerML;
      var okN = EB.nearly(v, q.answerNum);
      if (okML && okN) return { status: "correct" };
      var why = "";
      if (!okML) why += "「多／少」揀錯咗。";
      if (!okN) why += "百分數應該係 " + EB.decStr(q.answerNum) + "%。";
      return { status: "wrong", why: why };

    if (q.kind === "num+mcq") {
      var v2 = EB.parseNum(input.raw);
      if (v2 == null) return { status: "invalid", msg: "請先輸入百分數 ✏️" };
      if (!input.readChoice) return { status: "invalid", msg: "請再揀正確讀法 🙂" };
      var okP = EB.nearly(v2, q.answerNum);
      var okR = !!input.readChoice.correct;
      if (okP && okR) return { status: "correct" };
      var why2 = "";
      if (!okP) why2 += "百分數唔啱。";
      if (!okR) why2 += (input.readChoice.why || "讀法唔啱。");
      return { status: "wrong", why: why2 };
    }
    if (q.kind === "ratio") {
      var a = EB.parseNum(input.fields[0]), b = EB.parseNum(input.fields[1]);
      if (a == null || b == null) return { status: "invalid", msg: "前後兩個數都要填呀！" };
      if (EB.nearly(a, q.answerRatio[0]) && EB.nearly(b, q.answerRatio[1])) return { status: "correct" };
      // allow unsimplified if same ratio? Task often wants 最簡單. Accept equivalent integer ratio and hint if not simplest? I'll accept equivalent and also the simplest.
      if (b !== 0 && EB.nearly(a / b, q.answerRatio[0] / q.answerRatio[1])) {
        return { status: "wrong", why: "比嘅值啱咗，但題目要求<b>最簡單整數比</b>，請再約簡成 " + q.answerRatio[0] + " : " + q.answerRatio[1] + "。" };
      }
      return { status: "wrong", why: "順序亦都要啱：係 " + q.answerRatio[0] + " : " + q.answerRatio[1] + "。" };
    }
    if (q.kind === "multi") {
      var i, miss = [];
      for (i = 0; i < q.fields.length; i++) {
        var fv = EB.parseNum(input.fields[i]);
        if (fv == null) return { status: "invalid", msg: "請填晒每一格 ✏️" };
        if (!EB.nearly(fv, q.fields[i].answerNum)) miss.push(q.fields[i].label);
      }
      if (!miss.length) return { status: "correct" };
      return { status: "wrong", why: miss.join("、") + " 未啱。" };
    }
    if (q.kind === "table") {
      var j, bad = 0;
      for (j = 0; j < input.blankVals.length; j++) {
        var tv = EB.parseNum(input.fields[j]);
        if (tv == null) return { status: "invalid", msg: "請填晒所有空白格 ✏️" };
        if (!EB.nearly(tv, input.blankVals[j])) bad++;
      }
      if (!bad) return { status: "correct" };
      return { status: "wrong", why: "有 " + bad + " 格唔啱。每個對應都要合指定的比，或者百分數要正確除以 100。" };
    }
    if (q.kind === "numunit") {
      var uv = EB.parseNum(input.raw);
      if (uv == null) return { status: "invalid", msg: "請輸入數字 ✏️" };
      if (!input.unit) return { status: "invalid", msg: "請揀單位（毫升或升）🙂" };
      var u = null;
      q.units.forEach(function (x) { if (x.name === input.unit) u = x; });
      var ml = uv * (u ? u.factor : 1);
      if (EB.nearly(ml, q.answerNum)) return { status: "correct" };
      // also accept if they typed 1000 and chose 毫升, already covered; if they typed 1 meaning litre but chose ml, fail
      if (EB.nearly(uv, q.answerNum) && u && u.factor === 1) return { status: "correct" };
      return { status: "wrong", why: "記住 1 升 = 1000 毫升，並按比計出水量。" };
    }
    // num / default
    var nv = EB.parseNum(input.raw);
    if (nv == null) return { status: "invalid", msg: "請先輸入答案 ✏️" };
    if (EB.nearly(nv, q.answerNum)) return { status: "correct" };
    if (q.accept) {
      for (var k = 0; k < q.accept.length; k++) if (EB.nearly(nv, q.accept[k])) return { status: "correct" };
    }
    var whyE = "";
    (q.errors || []).forEach(function (e) { if (!whyE && EB.nearly(nv, e.v)) whyE = e.why; });
    return { status: "wrong", why: whyE };
  }

  function resolve(correct, why) {
    var q = S.current;
    S.answered = true;
    var fb = $("feedback");
    if (correct) {
      if (q.attempt === 0) { stat(q.topic).first++; S.stars++; }
      S.streak++; if (S.streak > S.best) S.best = S.streak;
      fb.className = "feedback good";

      $("showSolBtn").classList.remove("hidden");

    } else {
      stat(q.topic).wrong++;
      S.streak = 0;
      fb.className = "feedback bad";
      fb.innerHTML = pick(BAD) + '<div style="margin-top:6px;color:#2e7d32">正確答案：<span style="font-size:1.4em">' + q.answerH + "</span></div>";
      if (why) $("why").innerHTML = '<div class="why">💡 ' + why + "</div>";
      renderSolution();
      if (q.attempt < MAX_RETRY && typeof q.regen === "function") {

      }

    $("nextBtn").classList.remove("hidden");

    updateBar();
  }

  function renderSolution() {
    var q = S.current, h = "📖 逐步解法";
    h = "<h3>" + h + "</h3>";
    (q.steps || []).forEach(function (s) {
      h += '<div class="step">' + (s.note ? '<div class="snote">▶ ' + s.note + "</div>" : "") +
        '<div class="shtml">' + s.html + "</div>" +
        (s.detail ? '<div class="sdetail">' + s.detail + "</div>" : "") + "</div>";
    });
    $("solution").innerHTML = h;
    $("solution").classList.remove("hidden");
    $("showSolBtn").classList.add("hidden");
  }

  document.addEventListener("keydown", function (e) {
    if ($("quiz").classList.contains("hidden")) return;
    if (e.key === "Enter") {
      e.preventDefault();
      if (S.answered) $("nextBtn").click();
      else if (!$("keypad").classList.contains("hidden")) submitKey();
      return;
    }
    if (S.answered) return;
    if (/^[0-9.]$/.test(e.key) || e.key === "/") press(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); press("⌫"); }
  });

  $("showSolBtn").addEventListener("click", renderSolution);
  $("nextBtn").addEventListener("click", next);
  $("homeBtn").addEventListener("click", function () { if (confirm("要返回主頁嗎？今輪進度會冇咗。")) show("home"); });
  $("againBtn").addEventListener("click", function () { start(S.group); });
  $("backBtn").addEventListener("click", function () { show("home"); });

  function finish() {
    show("finish");
    var firstQs = 0, firstOk = 0, rows = "";
    Object.keys(S.stats).forEach(function (t) {
      var s = S.stats[t], lab = TOPIC_LABEL[t] || { icon: "📝", name: t };
      firstQs += s.total; firstOk += s.first;
      rows += "<tr><td>" + lab.icon + " " + lab.name + "</td><td>" + s.total + "</td><td>" + s.first + "</td><td>" + s.wrong + "</td><td>" + (s.first === s.total ? "🌟" : s.first / s.total >= 0.6 ? "👍" : "💪") + "</td></tr>";
    });
    $("sumTable").innerHTML = "<tr><th>主題</th><th>題數</th><th>一次答啱</th><th>答錯次數</th><th></th></tr>" + rows;
    var pct = firstQs ? firstOk / firstQs : 0;
    $("finEmoji").textContent = pct === 1 ? "🏆" : pct >= 0.8 ? "🥇" : pct >= 0.6 ? "🥈" : "💪";
    $("finTitle").textContent = pct === 1 ? "全部一次答啱！超級犀利！" : pct >= 0.8 ? "好叻呀！差少少就滿分！" : pct >= 0.6 ? "唔錯呀！繼續努力！" : "完成咗！多練幾次一定會進步！";
    $("finSummary").innerHTML = "⭐ " + S.stars + " / " + firstQs + " 題一次答啱　🔥 最高連續 " + S.best + " 題";
    confetti(pct >= 0.8 ? 40 : 15);
  }

  function confetti(n) {
    var icons = ["🎉", "⭐", "🌟", "🎊", "💯", "🧮", "🌈"];
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "confetti";
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = (1.4 + Math.random() * 2) + "s";
      document.body.appendChild(s);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4000); })(s);
    }
  }
  window.__app = { start: start, state: function () { return S; } };
})();
</script>

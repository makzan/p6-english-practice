<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🗣️ PowerLesson · IPA 音標</title>
<style>
  :root {
    --bg: linear-gradient(135deg,#a18cd1 0%,#fbc2eb 100%);
    --h: #4a148c;
    --sub: #6a1b9a;
    --bd: #ce93d8;
    --soft: #f3e5f5;
    --shadow: #ce93d8;
    --accent: #8e24aa;
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 14px;
    font-family: "Arial Rounded MT Bold", "Comic Sans MS", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg); background-attachment: fixed; color: #263238;
  }
  h1 { text-align: center; font-size: clamp(1.15rem, 4.6vw, 1.85rem); color: var(--h); text-shadow: 2px 2px 0 #fff; margin: 6px 0 2px; }
  .sub { text-align: center; color: var(--sub); margin: 0 0 14px; font-size: 1.02rem; }
  .card { background: #fff; border-radius: 26px; max-width: 720px; margin: 0 auto; padding: 20px 16px 24px; box-shadow: 0 10px 28px rgba(0,0,0,.18); border: 5px solid var(--bd); }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .intro { font-size: 1.05rem; line-height: 1.7; background: var(--soft); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
  .topics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .topic { background: var(--soft); border-radius: 18px; padding: 14px 10px; font-size: 1.08rem; font-weight: bold; color: var(--h); box-shadow: 0 5px 0 var(--shadow); text-align: left; }
  .topic .ti { font-size: 1.8rem; display: block; margin-bottom: 2px; }
  .topic:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }
  .topic.mix { grid-column: 1 / -1; background: #fff3e0; color: #e65100; box-shadow: 0 5px 0 #ffb74d; }
  .topic .desc { font-size: .82rem; font-weight: normal; margin-top: 4px; color: #555; }
  .topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { background: var(--soft); border-radius: 999px; padding: 6px 12px; font-weight: bold; color: var(--h); font-size: .95rem; }
  .pill.star { background: #fff8e1; color: #f57f17; }
  .pill.fire { background: #fbe9e7; color: #d84315; }
  .homebtn { background: #eceff1; border-radius: 999px; padding: 6px 12px; font-size: 1rem; }
  .bar { flex: 1 1 100%; height: 14px; background: #e0e0e0; border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), #42a5f5); transition: width .35s; }
  .tag { display: inline-block; background: var(--accent); color: #fff; border-radius: 12px; padding: 4px 12px; font-size: .95rem; }
  .retry { display: inline-block; background: #ffca28; color: #6d4c00; border-radius: 12px; padding: 3px 10px; font-size: .9rem; margin-left: 6px; }
  .prompt { font-size: 1.05rem; color: var(--h); margin: 10px 0 4px; font-weight: bold; }
  .sentence {
    font-size: clamp(1.12rem, 4.2vw, 1.5rem); line-height: 1.75; background: #fffde7;
    border-radius: 18px; padding: 14px; margin: 8px 0 10px; border: 3px dashed #ffd54f; color: #1a237e; font-weight: 600;
  }
  .blank { display: inline-block; min-width: 3.2em; padding: 1px 8px; margin: 0 1px; border-bottom: 3px solid var(--accent); background: var(--soft); border-radius: 6px 6px 0 0; color: var(--h); text-align: center; }
  .blank.right { background: #c8e6c9; border-bottom-color: #2e7d32; color: #1b5e20; }
  .blank.wrong { background: #ffcdd2; border-bottom-color: #c62828; color: #b71c1c; }
  .blank.open { background: #fff59d; border-bottom-color: #f9a825; box-shadow: 0 0 0 3px rgba(249,168,37,.35); cursor: pointer; }
  .verb { color: #888; font-size: .92em; font-weight: normal; }
  .ipa { font-size: 1.6rem; color: #6a1b9a; font-weight: bold; letter-spacing: .02em; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice {
    background: var(--soft); color: var(--h); font-size: clamp(1rem, 3.8vw, 1.28rem); font-weight: bold;
    border-radius: 16px; padding: 14px 8px; min-height: 60px; box-shadow: 0 5px 0 var(--shadow);
  }
  .choice:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--shadow); }
  .choice.right { background: #c8e6c9; box-shadow: 0 5px 0 #66bb6a; color: #1b5e20; }
  .choice.wrong { background: #ffcdd2; box-shadow: 0 5px 0 #e57373; color: #b71c1c; }
  .choice:disabled { cursor: default; }
  .speak { display: inline-block; margin: 6px 4px; background: #0288d1; color: #fff; font-size: 1.05rem; font-weight: bold; border-radius: 999px; padding: 10px 16px; box-shadow: 0 4px 0 #01579b; }
  .speak:active { transform: translateY(3px); box-shadow: 0 1px 0 #01579b; }
  .fb { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 10px; min-height: 1.3em; }
  .fb.good { color: #2e7d32; } .fb.bad { color: #c62828; }
  .why { background: #fff3e0; border-left: 6px solid #ff9800; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 1.05rem; line-height: 1.6; text-align: left; }
  .why b { color: #e65100; }
  .next { display: block; margin: 14px auto 0; font-size: 1.3rem; font-weight: bold; color: #fff; background: #fb8c00; border-radius: 20px; padding: 14px 28px; box-shadow: 0 6px 0 #e65100; min-width: 200px; }
  .next:active { transform: translateY(4px); box-shadow: 0 2px 0 #e65100; }
  .start { font-size: 1.3rem; font-weight: bold; color: #fff; background: var(--accent); border-radius: 20px; padding: 14px 28px; box-shadow: 0 6px 0 var(--h); }
  .bigemoji { font-size: 4rem; text-align: center; animation: bounce 1s infinite; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .row .next, .row .start { margin: 10px 0 0; }
  table.sum { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 1.05rem; }
  table.sum th, table.sum td { padding: 8px 6px; text-align: center; border-bottom: 2px solid #e0e0e0; }
  table.sum th { background: var(--soft); color: var(--h); }
  .missed { background: #fff8e1; border-radius: 12px; padding: 6px 10px; margin: 4px 0; font-size: .98rem; text-align: left; }
  .wordbank { font-size: .9rem; color: #555; background: var(--soft); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.5; }
  .passage { font-size: clamp(1.05rem, 3.8vw, 1.28rem); line-height: 1.85; color: #1a237e; background: #fffde7; border: 3px dashed #ffd54f; border-radius: 16px; padding: 14px 12px; margin-bottom: 12px; }
  .passage p { margin: 0 0 12px; }
  :root { --dock-h: 280px; }
  #picker {
    position: fixed !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
    width: 100% !important; z-index: 1000; max-height: min(46vh, 360px);
    overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    border-radius: 22px 22px 0 0; border: 4px solid #42a5f5; border-bottom: none;
    background: linear-gradient(180deg, #e3f2fd 0%, #bbdefb 100%);
    box-shadow: 0 -12px 32px rgba(0,40,80,.3);
  }
  #picker::before { content: ""; display: block; width: 44px; height: 5px; border-radius: 999px; background: rgba(0,0,0,.18); margin: 0 auto 8px; }
  #picker h3 { margin: 0 0 8px; color: #1565c0; font-size: 1.05rem; text-align: center; }
  #picker .dock-inner { max-width: 720px; margin: 0 auto; }
  body.picking #quiz.card { padding-bottom: calc(var(--dock-h) + 36px); }
  .blank { scroll-margin-bottom: calc(var(--dock-h) + 24px); scroll-margin-top: 72px; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .confetti { position: fixed; top: -30px; font-size: 1.7rem; pointer-events: none; animation: fall linear forwards; z-index: 99; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }
  a.backhome { display: inline-block; margin: 8px auto 0; color: var(--h); font-weight: bold; text-decoration: none; }

</style>
</head>
<body>
<h1>🗣️ PowerLesson · IPA 音標</h1>
<div class="sub">Long & Short Vowels + Consonants</div>
<p style="text-align:center;margin:0 0 10px"><a class="backhome" href="../">🏠 返回練習主頁</a></p>

<div class="card" id="home">
  <div class="intro">🔊 聽讀音、認 IPA 符號！<br>元音：/ɪ/ /e/ /æ/…　輔音：/ʃ/ /θ/ /ŋ/…<br>❌ 答錯會再練。</div>
  <div class="topics" id="topics"></div>
</div>

<div class="card hidden" id="quiz">
  <div class="topbar">
    <button class="homebtn" id="homeBtn">🏠 返回</button>
    <span class="pill" id="progTxt">1 / 1</span>
    <span class="pill star">⭐ <span id="stars">0</span></span>
    <span class="pill fire">🔥 <span id="streak">0</span></span>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div><span class="tag" id="tag"></span><span class="retry hidden" id="retryTag">🔁 再試呢題</span></div>
  <div class="prompt" id="prompt"></div>
  <div class="sentence" id="sentence"></div>
  <button class="speak" id="speakBtn">🔊 聽句子</button>
  <div class="choices" id="choices"></div>
  <div class="fb" id="fb"></div>
  <div id="why"></div>
  <button class="next hidden" id="nextBtn">下一題 ➡️</button>
</div>



<div class="card hidden" id="finish">
  <div class="bigemoji" id="finEmoji">🏆</div>
  <h2 style="text-align:center;color:var(--h);margin:6px 0" id="finTitle">完成！</h2>
  <p style="text-align:center;font-size:1.2rem" id="finSummary"></p>
  <table class="sum" id="sumTable"></table>
  <div id="missedBox"></div>
  <div class="row">
    <button class="start" id="againBtn">🔄 再玩一次</button>
    <button class="next" id="backBtn">🏠 揀其他主題</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var TOPICS = {"vowels": {"name": "IPA Vowels", "icon": "🔊", "desc": "長短元音"}, "consonants": {"name": "IPA Consonants", "icon": "🗣️", "desc": "輔音符號"}, "all": {"name": "全部混合", "icon": "🎲", "desc": "Vowels + Consonants"}};
  var ITEMS = [{"id": "v1", "topic": "vowels", "prompt": "Which of the following words has the /ɔː/ sound?", "ipa": "/ɔː/", "sentence": "揀含有呢個元音嘅字：", "answer": "fall", "answerH": "fall", "choices": ["beach", "team", "fall"], "tip": "目標音 /ɔː/ → <b>fall</b>。", "speak": "fall"}, {"id": "v2", "topic": "vowels", "prompt": "Which of the following words has the /ɪ/ sound?", "ipa": "/ɪ/", "sentence": "揀含有呢個元音嘅字：", "answer": "pick", "answerH": "pick", "choices": ["pick", "iceberg", "fast"], "tip": "目標音 /ɪ/ → <b>pick</b>。", "speak": "pick"}, {"id": "v3", "topic": "vowels", "prompt": "Which of the following words has the /e/ sound?", "ipa": "/e/", "sentence": "揀含有呢個元音嘅字：", "answer": "bed", "answerH": "bed", "choices": ["tree", "bed", "throat"], "tip": "目標音 /e/ → <b>bed</b>。", "speak": "bed"}, {"id": "v4", "topic": "vowels", "prompt": "Which of the following words has the /ɑː/ sound?", "ipa": "/ɑː/", "sentence": "揀含有呢個元音嘅字：", "answer": "park", "answerH": "park", "choices": ["park", "chips", "table"], "tip": "目標音 /ɑː/ → <b>park</b>。", "speak": "park"}, {"id": "v5", "topic": "vowels", "prompt": "Which of the following words has the /ʌ/ sound?", "ipa": "/ʌ/", "sentence": "揀含有呢個元音嘅字：", "answer": "must", "answerH": "must", "choices": ["book", "complete", "must"], "tip": "目標音 /ʌ/ → <b>must</b>。", "speak": "must"}, {"id": "v6", "topic": "vowels", "prompt": "Which of the following words has the /ɜː/ sound?", "ipa": "/ɜː/", "sentence": "揀含有呢個元音嘅字：", "answer": "third", "answerH": "third", "choices": ["cartoon", "third", "jacket"], "tip": "目標音 /ɜː/ → <b>third</b>。", "speak": "third"}, {"id": "v7", "topic": "vowels", "prompt": "Which of the following words has the /ɒ/ sound?", "ipa": "/ɒ/", "sentence": "揀含有呢個元音嘅字：", "answer": "pot", "answerH": "pot", "choices": ["vote", "shark", "pot"], "tip": "目標音 /ɒ/ → <b>pot</b>。", "speak": "pot"}, {"id": "v8", "topic": "vowels", "prompt": "Which of the following words has the /ə/ sound?", "ipa": "/ə/", "sentence": "揀含有呢個元音嘅字：", "answer": "feather", "answerH": "feather", "choices": ["egg", "meet", "feather"], "tip": "目標音 /ə/ → <b>feather</b>。", "speak": "feather"}, {"id": "c1", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>sh iny</u> → <b>shiny</b>", "html": "<u>sh iny</u> → <b>shiny</b>", "answer": "/ʃ/", "answerH": "/ʃ/", "choices": ["/ʧ/", "/ʃ/", "/s/"], "tip": "正確音／字係 <b>/ʃ/</b>。", "speak": "shiny"}, {"id": "c2", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>vi s ion</u> → <b>vision</b>", "html": "<u>vi s ion</u> → <b>vision</b>", "answer": "/ʒ/", "answerH": "/ʒ/", "choices": ["/ʒ/", "/z/", "/ʃ/"], "tip": "正確音／字係 <b>/ʒ/</b>。", "speak": "vision"}, {"id": "c3", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>th row</u> → <b>throw</b>", "html": "<u>th row</u> → <b>throw</b>", "answer": "/θ/", "answerH": "/θ/", "choices": ["/θ/", "/t/", "/ð/"], "tip": "正確音／字係 <b>/θ/</b>。", "speak": "throw"}, {"id": "c4", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>fea th er</u> → <b>feather</b>", "html": "<u>fea th er</u> → <b>feather</b>", "answer": "/ð/", "answerH": "/ð/", "choices": ["/θ/", "/f/", "/ð/"], "tip": "正確音／字係 <b>/ð/</b>。", "speak": "feather"}, {"id": "c5", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>fri dge</u> → <b>fridge</b>", "html": "<u>fri dge</u> → <b>fridge</b>", "answer": "/ʤ/", "answerH": "/ʤ/", "choices": ["/j/", "/ʤ/", "/ʃ/"], "tip": "正確音／字係 <b>/ʤ/</b>。", "speak": "fridge"}, {"id": "c6", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>y ellow</u> → <b>yellow</b>", "html": "<u>y ellow</u> → <b>yellow</b>", "answer": "/j/", "answerH": "/j/", "choices": ["/ʃ/", "/ʤ/", "/j/"], "tip": "正確音／字係 <b>/j/</b>。", "speak": "yellow"}, {"id": "c7", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>ch eck</u> → <b>check</b>", "html": "<u>ch eck</u> → <b>check</b>", "answer": "/ʧ/", "answerH": "/ʧ/", "choices": ["/θ/", "/ʧ/", "/ʃ/"], "tip": "正確音／字係 <b>/ʧ/</b>。", "speak": "check"}, {"id": "c8", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>z ebra</u> → <b>zebra</b>", "html": "<u>z ebra</u> → <b>zebra</b>", "answer": "/z/", "answerH": "/z/", "choices": ["/ʃ/", "/s/", "/z/"], "tip": "正確音／字係 <b>/z/</b>。", "speak": "zebra"}, {"id": "c9", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>f ire</u> → <b>fire</b>", "html": "<u>f ire</u> → <b>fire</b>", "answer": "/f/", "answerH": "/f/", "choices": ["/v/", "/f/", "/ʧ/"], "tip": "正確音／字係 <b>/f/</b>。", "speak": "fire"}, {"id": "c10", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>v ideo</u> → <b>video</b>", "html": "<u>v ideo</u> → <b>video</b>", "answer": "/v/", "answerH": "/v/", "choices": ["/v/", "/f/", "/ʧ/"], "tip": "正確音／字係 <b>/v/</b>。", "speak": "video"}, {"id": "c11", "topic": "consonants", "prompt": "畫線部分係咩輔音？", "sentence": "<u>si ng er</u> → <b>singer</b>", "html": "<u>si ng er</u> → <b>singer</b>", "answer": "/ŋ/", "answerH": "/ŋ/", "choices": ["/dʒ/", "/ʒ/", "/ŋ/"], "tip": "正確音／字係 <b>/ŋ/</b>。", "speak": "singer"}, {"id": "c12", "topic": "consonants", "prompt": "邊個字含有 /θ/ 呢個音？", "sentence": "揀含有 <span class='ipa'>/θ/</span> 嘅字：", "html": "揀含有 <span class='ipa'>/θ/</span> 嘅字：", "answer": "th ink", "answerH": "th ink", "choices": ["th ere", "l ea f", "th ink"], "tip": "正確音／字係 <b>th ink</b>。", "speak": "think"}];
  
  var ROUND_CAP = 99, MAX_RETRY = 1;
  var GOOD = ["🌟 好叻呀！", "🎉 完全正確！", "💯 犀利！", "🚀 勁呀！", "👏 Excellent!", "😎 Well done!"];
  var BAD = ["💪 唔緊要，睇吓提示！", "🙂 差少少！記住啦！", "🌱 錯咗先學得識！", "🤗 加油！"];

  function $(id) { return document.getElementById(id); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function show(id) { ["home","quiz","finish"].forEach(function(s){ $(s).classList.toggle("hidden", s !== id); }); window.scrollTo(0,0); document.body.classList.remove("picking"); if($("picker")) $("picker").classList.add("hidden"); }
  function ansKey(it) { return it.answerH || (Array.isArray(it.answer) ? it.answer.join(" … ") : it.answer); }
  function norm(s) {
    return String(s).toLowerCase()
      .replace(/['']/g, "'")
      .replace(/…/g, "...")
      .replace(/\s+/g, " ")
      .replace(/\b(will not)\b/g, "won't")
      .replace(/\b(do not)\b/g, "don't")
      .replace(/\b(does not)\b/g, "doesn't")
      .replace(/\b(did not)\b/g, "didn't")
      .replace(/\b(is not)\b/g, "isn't")
      .replace(/\b(are not)\b/g, "aren't")
      .replace(/\b(was not)\b/g, "wasn't")
      .replace(/\b(were not)\b/g, "weren't")
      .replace(/\b(has not)\b/g, "hasn't")
      .replace(/\b(have not)\b/g, "haven't")
      .trim();
  }
  function answersMatch(word, it) {
    var key = norm(ansKey(it));
    var w = norm(word);
    if (w === key) return true;
    if (it.alts) for (var i=0;i<it.alts.length;i++) if (norm(it.alts[i]) === w) return true;
    return false;
  }

  var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
  var voice = null;
  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices() || [];
    var prefs = [function(v){return /en-GB/i.test(v.lang);}, function(v){return /en-US/i.test(v.lang);}, function(v){return /^en/i.test(v.lang);}];
    for (var i=0;i<prefs.length;i++) for (var j=0;j<vs.length;j++) if (prefs[i](vs[j])) { voice=vs[j]; return; }
  }
  if (synth) { pickVoice(); if (synth.addEventListener) synth.addEventListener("voiceschanged", pickVoice); else synth.onvoiceschanged = pickVoice; }
  function speakText(t) {
    if (!synth || !t) return;
    if (!voice) pickVoice();
    synth.cancel();
    var u = new SpeechSynthesisUtterance(String(t).replace(/_/g, " ").replace(/______/g, "blank"));
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
    u.rate = 0.88;
    setTimeout(function(){ synth.speak(u); }, 40);
  }

  var S = null;

  function renderHome() {
    var box = $("topics"); box.innerHTML = "";
    Object.keys(TOPICS).forEach(function(k){
      var g = TOPICS[k], b = document.createElement("button");
      b.className = "topic" + (k === "all" ? " mix" : "");
      var n = poolFor(k).length;
      b.innerHTML = '<span class="ti">'+g.icon+"</span>"+g.name+'<div class="desc">'+g.desc+" · "+n+" 題</div>";
      b.addEventListener("click", function(){ start(k); });
      box.appendChild(b);
    });
  }

  function poolFor(group) {
    if (group === "all") return ITEMS.slice();
    return ITEMS.filter(function(it){ return it.topic === group; });
  }

  function start(group) {
    var pool = shuffle(poolFor(group));
    var n = Math.min(ROUND_CAP, pool.length);
    var qs = pool.slice(0, n).map(function(it){
      return { item: it, attempt: 0, choices: shuffle((it.choices || []).slice()) };
    });
    S = { group: group, queue: qs, current: null, done: 0, stars: 0, streak: 0, best: 0,
          stats: {}, missed: {}, totalFirst: n, mode: "mc" };
    Object.keys(TOPICS).forEach(function(k){ if (k!=="all") S.stats[k]={total:0,ok:0}; });
    show("quiz"); next();
  }

  function updateBar() {
    var total = S.done + S.queue.length + (S.current ? 1 : 0);
    $("progTxt").textContent = "第 " + Math.min(S.done+1, Math.max(total,1)) + " / " + total + " 題";
    $("bar").style.width = (total ? Math.round(S.done / total * 100) : 0) + "%";
    $("stars").textContent = S.stars; $("streak").textContent = S.streak;
  }

  function sentenceHTML(it, revealed, cls) {
    var show = !!revealed;
    var c = "blank" + (cls ? " " + cls : "");
    var html;
    if (it.html) {
      html = it.html;
      if (show) {
        var ans = Array.isArray(it.answer) ? it.answer : [it.answer];
        var i = 0;
        html = html.replace(/______/g, function(){ return '<span class="'+c+'">'+(ans[i++]||"")+"</span>"; });
      } else {
        html = html.replace(/______/g, '<span class="'+c+'">______</span>');
      }
    } else if (it.sentence) {
      var fill = show ? (Array.isArray(it.answer) ? it.answer : [String(it.answer)]) : null;
      var n = 0;
      html = it.sentence.replace(/______/g, function(){
        if (!show) return '<span class="'+c+'">______</span>';
        return '<span class="'+c+'">'+(fill[n++] || "")+"</span>";
      });
    } else {
      html = (it.before||"") + '<span class="'+c+'">'+(show?ansKey(it):"______")+"</span>" + (it.after||"");
    }
    if (it.verb) html += ' <span class="verb">'+it.verb+"</span>";
    if (it.ipa) html = '<div class="ipa">'+it.ipa+"</div>" + (it.promptWord ? '<div style="margin-top:8px">'+it.promptWord+"</div>" : "");
    return html;
  }

  function next() {
    document.body.classList.remove("picking");
    if ($("picker")) $("picker").classList.add("hidden");
    S.current = S.queue.shift() || null;
    if (!S.current) { finish(); return; }
    var q = S.current, it = q.item;
    S.answered = false;
    if (q.attempt === 0 && S.stats[it.topic]) S.stats[it.topic].total++;
    $("tag").textContent = (TOPICS[it.topic] ? TOPICS[it.topic].icon + " " + TOPICS[it.topic].name : it.topic);
    $("retryTag").classList.toggle("hidden", q.attempt === 0);
    $("prompt").textContent = it.prompt || "揀正確答案：";
    $("sentence").innerHTML = sentenceHTML(it, false, "");
    $("fb").textContent=""; $("fb").className="fb"; $("why").innerHTML="";
    $("nextBtn").classList.add("hidden");
    var box = $("choices"); box.innerHTML="";
    (q.choices.length ? q.choices : shuffle((it.choices||[]).slice())).forEach(function(w){
      var b = document.createElement("button");
      b.className="choice"; b.textContent=w; b.setAttribute("data-ans", w);
      b.addEventListener("click", function(){ choose(w,b); });
      box.appendChild(b);
    });
    updateBar();
  }

  function choose(word, btn) {
    if (S.answered) return;
    S.answered = true;
    var q = S.current, it = q.item;
    var correct = answersMatch(word, it);
    Array.prototype.forEach.call($("choices").children, function(c){
      c.disabled = true;
      if (answersMatch(c.getAttribute("data-ans"), it)) c.classList.add("right");
    });
    if (correct) {
      btn.classList.add("right");
      $("sentence").innerHTML = sentenceHTML(it, true, "right");
      if (q.attempt === 0) { S.stars++; if (S.stats[it.topic]) S.stats[it.topic].ok++; }
      S.streak++; if (S.streak > S.best) S.best = S.streak;
      $("fb").className="fb good";
      $("fb").innerHTML = pick(GOOD) + (S.streak>=3 ? " 🔥 連續 "+S.streak+" 題！" : "");
      confetti(S.streak>=5?12:6);
      if (it.speak) speakText(it.speak);
      else speakText(($("sentence").innerText || "").replace(/\([^)]*\)/g,""));
    } else {
      btn.classList.add("wrong");
      $("sentence").innerHTML = sentenceHTML(it, true, "wrong");
      S.streak = 0;
      S.missed[ansKey(it)] = (S.missed[ansKey(it)]||0) + 1;
      $("fb").className="fb bad";
      $("fb").innerHTML = pick(BAD) + '<div style="margin-top:6px;color:#2e7d32">正確答案：<b>' + ansKey(it) + "</b></div>";
      $("why").innerHTML = '<div class="why">💡 ' + (it.tip || "再睇清楚句子提示啦！") + "</div>";
      setTimeout(function(){ if (S.current === q) $("sentence").innerHTML = sentenceHTML(it, true, "right"); }, 550);
      if (q.attempt < MAX_RETRY) {
        S.queue.push({ item: it, attempt: q.attempt+1, choices: shuffle((it.choices||[]).slice()) });
      }
    }
    S.done++;
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").textContent = S.queue.length ? "下一題 ➡️" : "睇成績 🏆";
    updateBar();
  }

  function finish() {
    show("finish");
    var pct = S.totalFirst ? S.stars/S.totalFirst : 0;
    $("finEmoji").textContent = pct===1?"🏆":pct>=0.8?"🥇":pct>=0.6?"🥈":"💪";
    $("finTitle").textContent = pct===1?"全部一次答啱！超級犀利！":pct>=0.8?"好叻呀！差少少就滿分！":pct>=0.6?"唔錯呀！繼續努力！":"完成咗！多練習一定進步！";
    $("finSummary").innerHTML = "⭐ "+S.stars+" / "+S.totalFirst+" 題一次答啱　🔥 最高連續 "+S.best+" 題";
    var rows = "";
    Object.keys(S.stats).forEach(function(t){
      var s = S.stats[t]; if (!s.total) return;
      var name = TOPICS[t] ? TOPICS[t].icon+" "+TOPICS[t].name : t;
      rows += "<tr><td>"+name+"</td><td>"+s.total+"</td><td>"+s.ok+"</td></tr>";
    });
    $("sumTable").innerHTML = "<tr><th>主題</th><th>題數</th><th>一次答啱</th></tr>"+rows;
    var box = $("missedBox"); box.innerHTML="";
    var keys = Object.keys(S.missed);
    if (!keys.length) box.innerHTML = '<p style="text-align:center;color:#2e7d32;font-weight:bold">🥇 Perfect！</p>';
    else {
      box.innerHTML = '<p style="font-weight:bold;color:#e65100">📝 要多練習：</p>';
      keys.forEach(function(w){
        var d=document.createElement("div"); d.className="missed";
        d.innerHTML = "<b>"+w+"</b> <small>（錯 "+S.missed[w]+" 次）</small>";
        box.appendChild(d);
      });
    }
    confetti(pct>=0.8?28:10);
  }

  function confetti(n) {
    var icons=["🎉","⭐","🌟","🎊","📚","✍️","🌈"];
    for (var i=0;i<n;i++){
      var s=document.createElement("span"); s.className="confetti";
      s.textContent=icons[Math.floor(Math.random()*icons.length)];
      s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.4+Math.random()*2)+"s";
      document.body.appendChild(s);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },4000); })(s);
    }
  }

  $("againBtn").addEventListener("click", function(){ start(S.group); });
  $("backBtn").addEventListener("click", function(){ show("home"); });
  $("homeBtn").addEventListener("click", function(){ if(confirm("要返回主題選單嗎？今輪進度會冇咗。")) show("home"); });
  $("nextBtn").addEventListener("click", next);
  if ($("speakBtn")) $("speakBtn").addEventListener("click", function () {
    if (!S || !S.current) return;
    var it = S.current.item;
    if (S.answered && it.speak) speakText(it.speak);
    else if (it.speakBlank) speakText(it.speakBlank);
    else speakText(($("sentence").innerText||"").replace(/______/g,"blank"));
  });
  document.addEventListener("keydown", function(e){
    if ($("quiz").classList.contains("hidden")||!S||!S.current) return;
    if (e.key==="Enter" && S.answered) { e.preventDefault(); next(); return; }
    if (!S.answered && /^[1-4]$/.test(e.key)) {
      var b=$("choices").children[+e.key-1]; if (b) b.click();
    }
  });

  renderHome();

  
})();
</script>
</body>
</html>

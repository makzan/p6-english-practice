  .choice {
    background: #e3f2fd; color: #0d47a1; font-size: clamp(1rem, 3.8vw, 1.22rem); font-weight: bold;

  .choice.wrong { background: #ffcdd2; box-shadow: 0 5px 0 #e57373; color: #b71c1c; }

  .speak { display: inline-block; margin: 6px 4px; background: #118ab2; color: #fff; font-size: 1.05rem; font-weight: bold; border-radius: 999px; padding: 12px 18px; box-shadow: 0 4px 0 #01579b; }

  .note { font-size: .92rem; color: #555; line-height: 1.5; margin-top: 8px; }

  function $(id) { return document.getElementById(id); }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function show(id) {
    ["homeScreen","setupScreen","listScreen","quizScreen","finishScreen"].forEach(function (s) {
      $(s).classList.toggle("hidden", s !== id);
    });
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[c];
    });
  }

  function norm(s) {
    return String(s).toLowerCase()
      .replace(/[’‘‛]/g, "'")
      .replace(/[‐‑–—−]/g, "-")
      .replace(/-/g, " ")
      .replace(/[^a-z0-9'\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }
  function accepted(w) {
    var list = [w.en].concat(w.alts || []);
    return list;
  }
  function spellOk(input, w) {
    var got = norm(input);
    if (!got) return false;
    return accepted(w).some(function (a) { return norm(a) === got; });
  }
  function speakOf(w) { return w.speak || accepted(w)[0]; }
  function labelOf(w) { return w.rec ? "只須辨認" : "產出"; }

  /* ---------- Speech ---------- */
  var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
  var chosenVoice = null;
  function pickVoice() {
    if (!synth) return;
    var voices = synth.getVoices() || [];
    if (!voices.length) return;
    var prefs = [
      function (v) { return /en-GB/i.test(v.lang) && /google|natural|daniel|serena|kate|female/i.test(v.name); },
      function (v) { return /en-GB/i.test(v.lang); },
      function (v) { return /en-US/i.test(v.lang) && /google|natural|samantha/i.test(v.name); },
      function (v) { return /en-US/i.test(v.lang); },
      function (v) { return /^en/i.test(v.lang); }
    ];
    for (var i = 0; i < prefs.length; i++) {
      for (var j = 0; j < voices.length; j++) {
        if (prefs[i](voices[j])) { chosenVoice = voices[j]; return; }
      }
    }
  }
  if (synth) {
    pickVoice();
    if (typeof synth.addEventListener === "function") synth.addEventListener("voiceschanged", pickVoice);
    else synth.onvoiceschanged = pickVoice;
  }
  function speak(text) {
    if (!synth || !text) return;
    if (!chosenVoice) pickVoice();
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    if (chosenVoice) { u.voice = chosenVoice; u.lang = chosenVoice.lang; }
    else { u.lang = "en-GB"; }
    u.rate = 0.8; u.pitch = 1;
    setTimeout(function () { synth.speak(u); }, 60);
  }
  function stopSpeak() { if (synth) synth.cancel(); }

  /* ---------- Distractors ---------- */
  function choicesFor(item, field, n) {
    n = n || 4;
    var pool = WORDS.filter(function (w) { return w !== item && w[field] !== item[field]; });
    var sameCat = pool.filter(function (w) { return w.cat === item.cat; });
    var samePos = pool.filter(function (w) { return w.pos === item.pos && w.cat !== item.cat; });
    var rest = pool.filter(function (w) { return w.cat !== item.cat && w.pos !== item.pos; });
    var picked = [];
    function take(src, k) {
      shuffle(src).forEach(function (w) {
        if (picked.length >= k) return;
        if (picked.indexOf(w) < 0) picked.push(w);
      });
    }
    take(sameCat, n - 1);
    take(samePos, n - 1);
    take(rest, n - 1);
    var opts = shuffle([item].concat(picked.slice(0, n - 1)));
    return opts;
  }

  function explain(item, ok, typed) {
    var parts = [];
    if (ok) return "";
    parts.push("正確係 <b>" + escapeHtml(item.en) + "</b> " + escapeHtml(item.pos) + " — " + escapeHtml(item.zh) + "。");
    parts.push("音標：" + escapeHtml(item.ipa));
    if (item.tip) parts.push(item.tip);
    if (typed != null && String(typed).trim()) {
      parts.push("你寫咗：" + escapeHtml(String(typed).trim()));
    }
    if (!item.rec && item.en.indexOf(" ") >= 0) {
      parts.push("記住要寫晒成個詞組，唔好漏字。");
    }
    return parts.join("<br>");
  }

  /* ---------- Question types ---------- */
  function typesFor(w, mode) {
    if (mode === "match") return w.rec ? ["en2zh","zh2en"] : ["en2zh","zh2en"];
    if (mode === "spell") return ["spell"];
    if (mode === "listen") return w.rec ? ["listen-zh"] : ["listen-zh","listen-spell"];
    // mix
    if (w.rec) return ["en2zh","zh2en","listen-zh"];
    return ["en2zh","zh2en","spell","listen-zh","listen-spell"];
  }

  /* ---------- State ---------- */
  var S = null;
  var pendingMode = null;

  function poolOf(key) { return key === "prod" ? PROD.slice() : WORDS.slice(); }

  function start(mode, size) {
    var cfg = MODES[mode];
    var pool = shuffle(poolOf(cfg.pool));
    if (size && size < pool.length) pool = pool.slice(0, size);
    var qs = pool.map(function (w) {
      var typ = pick(typesFor(w, mode));
      return { word: w, type: typ, attempt: 0 };
    });
    S = {
      mode: mode, queue: qs, current: null, done: 0, stars: 0,
      firstTotal: qs.length, missed: {}, retryN: 0
    };
    show("quizScreen");
    $("modePill").textContent = cfg.icon + " " + cfg.name;
    nextQ();
  }

  function updateBar() {
    var total = S.done + S.queue.length + (S.current ? 1 : 0);
    $("progTxt").textContent = "第 " + Math.min(S.done + 1, Math.max(total, 1)) + " / " + total + " 題";
    $("bar").style.width = (total ? Math.round(S.done / total * 100) : 0) + "%";
    $("stars").textContent = S.stars;
    $("retryN").textContent = S.retryN;
  }

  function speakBtn(w) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "speak"; b.textContent = "🔊 聽讀音";
    b.addEventListener("click", function () { speak(speakOf(w)); });
    return b;
  }

  function nextQ() {
    stopSpeak();
    $("fb").textContent = ""; $("fb").className = "fb";
    $("why").className = "why hidden"; $("why").innerHTML = "";
    $("nextBtn").classList.add("hidden");
    if (!S.queue.length) { finish(); return; }
    S.current = S.queue.shift();
    $("retryTag").classList.toggle("hidden", S.current.attempt === 0);
    updateBar();
    renderQ(S.current);
  }

  function renderQ(q) {
    var w = q.word, t = q.type, box = $("qArea");
    box.innerHTML = "";
    var pos = document.createElement("span"); pos.className = "pos"; pos.textContent = w.pos;
    box.appendChild(pos);
    if (w.rec) {
      var badge = document.createElement("span"); badge.className = "badge"; badge.textContent = "只須辨認";
      box.appendChild(badge);
    }
    box.appendChild(document.createElement("br"));

    if (t === "en2zh") {
      var p = document.createElement("div"); p.className = "prompt"; p.textContent = "呢個英文詞係咩意思？";
      var en = document.createElement("div"); en.className = "english"; en.textContent = w.en;
      var ipa = document.createElement("div"); ipa.className = "ipa"; ipa.textContent = w.ipa;
      box.appendChild(p); box.appendChild(en); box.appendChild(ipa);
      box.appendChild(speakBtn(w));
      addChoices(box, w, "zh");
      speak(speakOf(w));
    } else if (t === "zh2en") {
      var p2 = document.createElement("div"); p2.className = "prompt"; p2.textContent = "邊個英文詞係呢個意思？";
      var zh = document.createElement("div"); zh.className = "chinese"; zh.textContent = w.zh;
      box.appendChild(p2); box.appendChild(zh);
      addChoices(box, w, "en");
    } else if (t === "spell") {
      var p3 = document.createElement("div"); p3.className = "prompt"; p3.textContent = "睇中文、聽讀音，串出英文詞：";
      var zh3 = document.createElement("div"); zh3.className = "chinese"; zh3.textContent = w.zh;
      box.appendChild(p3); box.appendChild(zh3);
      box.appendChild(speakBtn(w));
      addSpell(box, w, false);
      speak(speakOf(w));
    } else if (t === "listen-zh") {
      var p4 = document.createElement("div"); p4.className = "prompt"; p4.textContent = "聽讀音，揀正確意思：";
      var h4 = document.createElement("div"); h4.className = "hint"; h4.textContent = "可以再按一次聽。";
      box.appendChild(p4); box.appendChild(h4);
      box.appendChild(speakBtn(w));
      addChoices(box, w, "zh");
      speak(speakOf(w));
    } else if (t === "listen-spell") {
      var p5 = document.createElement("div"); p5.className = "prompt"; p5.textContent = "聽讀音，串出英文詞：";
      var h5 = document.createElement("div"); h5.className = "hint"; h5.textContent = "呢題唔顯示中文，專心聽啦！";
      box.appendChild(p5); box.appendChild(h5);
      box.appendChild(speakBtn(w));
      addSpell(box, w, true);
      speak(speakOf(w));
    }
  }

  function addChoices(box, w, field) {
    var wrap = document.createElement("div"); wrap.className = "choices";
    var opts = choicesFor(w, field, 4);
    opts.forEach(function (opt) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "choice";
      b.textContent = opt[field];
      b.addEventListener("click", function () { judgeChoice(w, field, opt, wrap); });
      wrap.appendChild(b);
    });
    box.appendChild(wrap);
  }

  function addSpell(box, w, fromListen) {
    var inp = document.createElement("input");
    inp.type = "text"; inp.className = "spell"; inp.lang = "en";
    inp.setAttribute("autocomplete","off");
    inp.setAttribute("autocapitalize","off");
    inp.setAttribute("autocorrect","off");
    inp.setAttribute("spellcheck","false");
    inp.setAttribute("enterkeyhint","done");
    inp.placeholder = fromListen ? "聽完就打英文…" : "喺呢度串英文…";
    var go = document.createElement("button");
    go.type = "button"; go.className = "btn-go"; go.textContent = "提交 ✅";
    function submit() {
      if (go.disabled) return;
      judgeSpell(w, inp, go);
    }
    go.addEventListener("click", submit);
    inp.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
    });
    box.appendChild(inp); box.appendChild(go);
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 80);
  }

  function lockChoices(wrap, w, field, picked) {
    var buttons = wrap.querySelectorAll(".choice");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].disabled = true;
      var label = buttons[i].textContent;
      if (label === w[field]) buttons[i].classList.add("right");
      else if (picked && label === picked[field] && picked !== w) buttons[i].classList.add("wrong");
    }
  }

  function judgeChoice(w, field, picked, wrap) {
    if (!S || !S.current) return;
    var ok = picked === w;
    lockChoices(wrap, w, field, picked);
    settle(ok, w, null);
  }

  function judgeSpell(w, inp, go) {
    if (!S || !S.current) return;
    var ok = spellOk(inp.value, w);
    inp.disabled = true; go.disabled = true;
    inp.classList.add(ok ? "right" : "wrong");
    settle(ok, w, inp.value);
  }

  function settle(ok, w, typed) {
    var q = S.current;
    $("fb").className = "fb " + (ok ? "good" : "bad");
    $("fb").textContent = ok ? pick(GOOD) : pick(BAD);
    if (!ok) {
      $("why").className = "why";
      $("why").innerHTML = explain(w, false, typed);
      S.missed[w.en] = (S.missed[w.en] || 0) + 1;
      S.retryN += 1;
      // requeue a similar retry later
      S.queue.push({ word: w, type: q.type, attempt: q.attempt + 1 });
    } else {
      if (q.attempt === 0) S.stars += 1;
      var brief = document.createElement("div");
      brief.style.marginTop = "6px";
      brief.innerHTML = "<span class=\"ipa\">" + escapeHtml(w.en) + " " + escapeHtml(w.ipa) + "</span> · " + escapeHtml(w.zh);
      $("qArea").appendChild(brief);
    }
    S.done += 1;
    updateBar();
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").focus();
  }

  function finish() {
    stopSpeak();
    show("finishScreen");
    var missedKeys = Object.keys(S.missed);
    var firstOk = S.firstTotal - missedKeys.length;
    $("summary").textContent = "一次答啱 " + firstOk + " / " + S.firstTotal + " 題。" + (missedKeys.length ? " 其餘題目已重練到識為止！" : "");
    var sec = $("retrySection");
    sec.innerHTML = "";
    if (missedKeys.length) {
      var p = document.createElement("p");
      p.style.cssText = "font-size:1.1rem;font-weight:bold;color:#b35900";
      p.textContent = "📝 呢啲字要多啲練習：";
      var ul = document.createElement("ul"); ul.className = "retry-list";
      missedKeys.forEach(function (k) {
        var w = WORDS.filter(function (x) { return x.en === k; })[0];
        if (!w) return;
        var li = document.createElement("li");
        li.innerHTML = "<b>" + escapeHtml(w.en) + "</b> " + escapeHtml(w.pos) + "<br>" + escapeHtml(w.zh);
        li.title = "按一下聽讀音";
        li.addEventListener("click", function () { speak(speakOf(w)); });
        ul.appendChild(li);
      });
      sec.appendChild(p); sec.appendChild(ul);
    } else {
      var p2 = document.createElement("p"); p2.style.fontSize = "1.15rem";
      p2.textContent = "全部一次過答啱，太厲害啦！🌟";
      sec.appendChild(p2);
    }
    confetti(40);
  }

  function confetti(n) {
    var icons = ["🎉","⭐","🌟","🎊","💼","🎧","🌈","💖"];
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "confetti";
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = (1.5 + Math.random() * 2) + "s";
      document.body.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 4000); })(s);
    }
  }

  /* ---------- Word list ---------- */
  function renderList() {
    var box = $("wordList"); box.innerHTML = "";
    function section(title, arr, rec) {
      var h = document.createElement("h2"); h.className = "list-sec";
      h.textContent = title;
      box.appendChild(h);
      arr.forEach(function (w) {
        var row = document.createElement("div"); row.className = "wrow";
        var left = document.createElement("div");
        var en = document.createElement("div"); en.className = "en";
        en.textContent = w.n + ". " + w.en + "  " + w.pos;
        if (rec) {
          var b = document.createElement("span"); b.className = "badge"; b.textContent = "只須辨認";
          en.appendChild(document.createTextNode(" ")); en.appendChild(b);
        }
        var meta = document.createElement("div"); meta.className = "meta"; meta.textContent = w.ipa;
        var zh = document.createElement("div"); zh.className = "zh"; zh.textContent = w.zh;
        if (w.tip) {
          var tip = document.createElement("div"); tip.className = "note"; tip.textContent = w.tip;
          left.appendChild(en); left.appendChild(meta); left.appendChild(zh); left.appendChild(tip);
        } else {
          left.appendChild(en); left.appendChild(meta); left.appendChild(zh);
        }
        var btn = speakBtn(w);
        row.appendChild(left); row.appendChild(btn);
        box.appendChild(row);
      });
    }
    section("產出詞彙 Productive（要識串、讀、解釋）", PROD, false);
    section("接受詞彙 Receptive（只須辨認意思）", REC, true);
  }

  /* ---------- Home / setup ---------- */
  function renderHome() {
    var box = $("topics"); box.innerHTML = "";
    Object.keys(MODES).forEach(function (k) {
      var m = MODES[k];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "topic" + (k === "mix" ? " mix" : "");
      b.innerHTML = '<span class="ti">' + m.icon + "</span>" + m.name + '<div class="desc">' + m.desc + "</div>";
      b.addEventListener("click", function () { chooseMode(k); });
      box.appendChild(b);
    });
  }

  function chooseMode(k) {
    stopSpeak();
    if (k === "list") {
      renderList();
      show("listScreen");
      return;
    }
    pendingMode = k;
    var m = MODES[k];
    var pool = poolOf(m.pool);
    $("setupTitle").textContent = m.icon + " " + m.name;
    $("setupDesc").textContent = m.desc + " 而家有 " + pool.length + " 個詞。想一次過練晒，定係先試短關？";
    var sizes = $("setupSizes"); sizes.innerHTML = "";
    var opts = [];
    if (pool.length > 12) opts.push({ n:12, label:"隨機 12 題 🚀" });
    if (pool.length > 20) opts.push({ n:20, label:"隨機 20 題 💪" });
    opts.push({ n:pool.length, label:"全部 " + pool.length + " 題 🏆" });
    opts.forEach(function (o) {
      var b = document.createElement("button");
      b.type = "button"; b.className = o.n === pool.length ? "btn-start" : "btn-go";
      b.textContent = o.label;
      b.addEventListener("click", function () { start(k, o.n); });
      sizes.appendChild(b);
    });
    show("setupScreen");
  }

  function goHome() {
    stopSpeak();
    S = null; pendingMode = null;
    show("homeScreen");
  }

  /* ---------- Events ---------- */
  if (!synth) $("voiceWarn").classList.remove("hidden");
  renderHome();

  $("setupBack").addEventListener("click", goHome);
  $("listBack").addEventListener("click", goHome);
  $("listStop").addEventListener("click", stopSpeak);
  $("quizBack").addEventListener("click", function () {
    if (S && (S.done || S.queue.length) && !confirm("而家離開會中斷呢一局，確定？")) return;
    goHome();
  });
  $("nextBtn").addEventListener("click", nextQ);
  $("againBtn").addEventListener("click", function () {
    if (S && S.mode) start(S.mode, S.firstTotal);
  });
  $("finishHome").addEventListener("click", goHome);

  // Expose for tests
  window.__unit3 = {
    WORDS: WORDS, PROD: PROD, REC: REC,
    norm: norm, spellOk: spellOk, accepted: accepted,
    typesFor: typesFor, choicesFor: choicesFor, speakOf: speakOf
  };
})();
</script>
</body>
</html>

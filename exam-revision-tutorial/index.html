<style>

  .topic.mix { grid-column: 1 / -1; }

  var ITEMS = [{"id": "u1p01", "sentence": "Waking up, eating breakfast and packing my bag at the same time every day is my morning ______.", "answer": "routine", "choices": ["routine", "assignment", "equipment", "journal"], "tip": "每日固定做法 → <b>routine</b>（日常作息）。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p02", "sentence": "At the start of the school year, I like to ______ so I know what I want to achieve.", "answer": "set goals", "choices": ["set goals", "take notes", "ask for help", "play fair"], "tip": "訂立目標 → <b>set goals</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p03", "sentence": "I am going to ______ after school. Do you think I should do music or science?", "answer": "join a club", "choices": ["join a club", "tidy the classroom", "go to university", "manage stress"], "tip": "參加學會 → <b>join a club</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p04", "sentence": "If you want to feel fresh in the morning, you should ______ and get enough sleep.", "answer": "go to bed early", "choices": ["go to bed early", "study harder", "take notes", "feel proud"], "tip": "早睡 → <b>go to bed early</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p05", "sentence": "In group projects we must ______ with our classmates and share the work fairly.", "answer": "cooperate", "choices": ["cooperate", "be honest", "ask for help", "discover new things"], "tip": "合作 → <b>cooperate</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p06", "sentence": "Please ______ for the assembly. The teacher does not like students who are late.", "answer": "arrive on time", "choices": ["arrive on time", "play fair", "take notes", "feel proud"], "tip": "準時到達 → <b>arrive on time</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p07", "sentence": "My sister doesn't know how to ______ — every time she feels nervous about school, she gets angry.", "answer": "manage stress", "choices": ["manage stress", "feel proud", "be honest", "join a club"], "tip": "處理壓力 → <b>manage stress</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p08", "sentence": "If we don't ______, it will smell bad and look very messy during class time.", "answer": "tidy the classroom", "choices": ["tidy the classroom", "join a club", "learn a language", "win an award"], "tip": "收拾課室 → <b>tidy the classroom</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p09", "sentence": "It is easiest to ______ as a baby or young child. That is why we start English early.", "answer": "learn a language", "choices": ["learn a language", "discover new things", "go to university", "set goals"], "tip": "學語言 → <b>learn a language</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p10", "sentence": "You did really well in the race. You should ______ of yourself.", "answer": "feel proud", "choices": ["feel proud", "be honest", "ask for help", "play fair"], "tip": "為自己感到驕傲 → <b>feel proud</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p11", "sentence": "Last month I came first in the reading contest and I was happy to ______.", "answer": "win an award", "choices": ["win an award", "go to university", "take notes", "set goals"], "tip": "獲獎 → <b>win an award</b>。", "alts": ["receive an award"], "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p12", "sentence": "Even if you make a mistake, you should always ______ and tell the truth.", "answer": "be honest", "choices": ["be honest", "feel proud", "cooperate", "manage stress"], "tip": "誠實 → <b>be honest</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p13", "sentence": "The students promise they will ______ for the next quiz.", "answer": "study harder", "choices": ["study harder", "go to bed early", "take notes", "play fair"], "tip": "更努力溫習 → <b>study harder</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p14", "sentence": "In the last 100 years, humans have been able to ______ about outer space.", "answer": "discover new things", "choices": ["discover new things", "learn a language", "join a club", "ask for help"], "tip": "發現新事物 → <b>discover new things</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p15", "sentence": "The PE teacher checked the sports ______ before the match to make sure everything was safe.", "answer": "equipment", "choices": ["equipment", "counsellor", "routine", "assignment"], "tip": "器材／設備 → <b>equipment</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p16", "sentence": "If you feel worried at school, you can talk to the school ______.", "answer": "counsellor", "choices": ["counsellor", "equipment", "journal", "assignment"], "tip": "輔導員 → <b>counsellor</b>（美式 counselor 亦可）。", "alts": ["counselor"], "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p17", "sentence": "In sports we always ______ and never cheat.", "answer": "play fair", "choices": ["play fair", "arrive on time", "be honest", "cooperate"], "tip": "公平比賽、唔作弊 → <b>play fair</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p18", "sentence": "When I finish high school, I hope to ______ and study to become a doctor.", "answer": "go to university", "choices": ["go to university", "join a club", "win an award", "set goals"], "tip": "上大學 → <b>go to university</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p19", "sentence": "If you don't understand the homework, you should ______ from the teacher.", "answer": "ask for help", "choices": ["ask for help", "take notes", "feel proud", "be honest"], "tip": "求助 → <b>ask for help</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1p20", "sentence": "During the lesson, please ______ carefully so you can revise later.", "answer": "take notes", "choices": ["take notes", "set goals", "play fair", "tidy the classroom"], "tip": "做筆記 → <b>take notes</b>。", "topic": "u1", "prompt": "用 Unit 1 生字／片語填空："}, {"id": "u1r01", "sentence": "My mum taught me to ______ by       .replace(/(is not)/g, "isn't")
      .replace(/(are not)/g, "aren't")
      .replace(/(was not)/g, "wasn't")
      .replace(/(were not)/g, "weren't")
      .replace(/(has not)/g, "hasn't")
      .replace(/(have not)/g, "haven't")
      .trim();
  }
  function answersMatch(word, it) {
    var key = norm(ansKey(it));
    var w = norm(word);
    if (w === key) return true;
    if (it.alts) for (var i=0;i<it.alts.length;i++) if (norm(it.alts[i]) === w) return true;
    // allow ellipsis variants: "did … get" vs "did get"
    if (key.replace(/\s*\.\.\.\s*/g," ").replace(/\s+/g," ") === w.replace(/\s*\.\.\.\s*/g," ").replace(/\s+/g," ")) return true;
    return false;
  }

  var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
  var voice = null;
  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices() || [];
    var prefs = [function(v){return /en-GB/i.test(v.lang);}, function(v){return /en-US/i.test(v.lang);}, function(v){return /^en/i.test(v.lang);}];
    for (var i=0;i<prefs.length;i++) for (var j=0;j<vs.length;j++) if (prefs[i](vs[j])) { voice=vs[j]; return; }
  }
  if (synth) { pickVoice(); if (synth.addEventListener) synth.addEventListener("voiceschanged", pickVoice); else synth.onvoiceschanged = pickVoice; }
  function speakText(t) {
    if (!synth || !t) return;
    if (!voice) pickVoice();
    synth.cancel();
    var u = new SpeechSynthesisUtterance(String(t).replace(/_/g, " ").replace(/______/g, "blank").replace(/…/g," "));
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
    u.rate = 0.88;
    setTimeout(function(){ synth.speak(u); }, 40);
  }

  var S = null;

  function renderHome() {
    var box = $("topics"); box.innerHTML = "";
    Object.keys(TOPICS).forEach(function(k){
      var g = TOPICS[k], b = document.createElement("button");
      b.className = "topic" + (k === "all" ? " mix" : "");
      var n = poolFor(k).length;
      b.innerHTML = '<span class="ti">'+g.icon+"</span>"+g.name+'<div class="desc">'+g.desc+" · "+n+" 題</div>";
      b.addEventListener("click", function(){ start(k); });
      box.appendChild(b);
    });
  }

  function poolFor(group) {
    if (group === "all") return ITEMS.slice();
    return ITEMS.filter(function(it){ return it.topic === group; });
  }

  function start(group) {
    var pool = shuffle(poolFor(group));
    var n = Math.min(ROUND_CAP, pool.length);
    var qs = pool.slice(0, n).map(function(it){
      return { item: it, attempt: 0, choices: shuffle((it.choices || []).slice()) };
    });
    S = { group: group, queue: qs, current: null, done: 0, stars: 0, streak: 0, best: 0,
          stats: {}, missed: {}, totalFirst: n };
    Object.keys(TOPICS).forEach(function(k){ if (k!=="all") S.stats[k]={total:0,ok:0}; });
    show("quiz"); next();
  }

  function updateBar() {
    var total = S.done + S.queue.length + (S.current ? 1 : 0);
    $("progTxt").textContent = "第 " + Math.min(S.done+1, Math.max(total,1)) + " / " + total + " 題";
    $("bar").style.width = (total ? Math.round(S.done / total * 100) : 0) + "%";
    $("stars").textContent = S.stars; $("streak").textContent = S.streak;
  }

  function sentenceHTML(it, revealed, cls) {
    var show = !!revealed;
    var c = "blank" + (cls ? " " + cls : "");
    var html;
    if (it.sentence) {
      var fill = show ? (Array.isArray(it.answer) ? it.answer : [String(it.answer)]) : null;
      var n = 0;
      html = it.sentence.replace(/______/g, function(){
        if (!show) return '<span class="'+c+'">______</span>';
        return '<span class="'+c+'">'+(fill[n++] || "")+"</span>";
      });
      // also support ______(verb) style already in sentence as blank already
    } else {
      html = (it.before||"") + '<span class="'+c+'">'+(show?ansKey(it):"______")+"</span>" + (it.after||"");
    }
    return html;
  }

  function next() {
    S.current = S.queue.shift() || null;
    if (!S.current) { finish(); return; }
    var q = S.current, it = q.item;
    S.answered = false;
    if (q.attempt === 0 && S.stats[it.topic]) S.stats[it.topic].total++;
    $("tag").textContent = (TOPICS[it.topic] ? TOPICS[it.topic].icon + " " + TOPICS[it.topic].name : it.topic);
    $("retryTag").classList.toggle("hidden", q.attempt === 0);
    $("prompt").textContent = it.prompt || "揀正確答案：";
    $("hintbox").classList.add("hidden");
    $("sentence").innerHTML = sentenceHTML(it, false, "");
    $("fb").textContent=""; $("fb").className="fb"; $("why").innerHTML="";
    $("nextBtn").classList.add("hidden");
    var box = $("choices"); box.innerHTML="";
    (q.choices.length ? q.choices : shuffle((it.choices||[]).slice())).forEach(function(w){
      var b = document.createElement("button");
      b.className="choice"; b.textContent=w; b.setAttribute("data-ans", w);
      b.addEventListener("click", function(){ choose(w,b); });
      box.appendChild(b);
    });
    updateBar();
  }

  function choose(word, btn) {
    if (S.answered) return;
    S.answered = true;
    var q = S.current, it = q.item;
    var correct = answersMatch(word, it);
    Array.prototype.forEach.call($("choices").children, function(c){
      c.disabled = true;
      if (answersMatch(c.getAttribute("data-ans"), it)) c.classList.add("right");
    });
    if (correct) {
      btn.classList.add("right");
      $("sentence").innerHTML = sentenceHTML(it, true, "right");
      if (q.attempt === 0) { S.stars++; if (S.stats[it.topic]) S.stats[it.topic].ok++; }
      S.streak++; if (S.streak > S.best) S.best = S.streak;
      $("fb").className="fb good";
      $("fb").innerHTML = pick(GOOD) + (S.streak>=3 ? " 🔥 連續 "+S.streak+" 題！" : "");
      confetti(S.streak>=5?12:6);
      speakText(($("sentence").innerText || "").replace(/\([^)]*\)/g,""));
    } else {
      btn.classList.add("wrong");
      $("sentence").innerHTML = sentenceHTML(it, true, "wrong");
      S.streak = 0;
      S.missed[ansKey(it)] = (S.missed[ansKey(it)]||0) + 1;
      $("fb").className="fb bad";
      $("fb").innerHTML = pick(BAD) + '<div style="margin-top:6px;color:#2e7d32">正確答案：<b>' + ansKey(it) + "</b></div>";
      $("why").innerHTML = '<div class="why">💡 ' + (it.tip || "再睇清楚句子提示啦！") + "</div>";
      setTimeout(function(){ if (S.current === q) $("sentence").innerHTML = sentenceHTML(it, true, "right"); }, 550);
      if (q.attempt < MAX_RETRY) {
        S.queue.push({ item: it, attempt: q.attempt+1, choices: shuffle((it.choices||[]).slice()) });
      }
    }
    S.done++;
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").textContent = S.queue.length ? "下一題 ➡️" : "睇成績 🏆";
    updateBar();
  }

  function finish() {
    show("finish");
    var pct = S.totalFirst ? S.stars/S.totalFirst : 0;
    $("finEmoji").textContent = pct===1?"🏆":pct>=0.8?"🥇":pct>=0.6?"🥈":"💪";
    $("finTitle").textContent = pct===1?"全部一次答啱！超級犀利！":pct>=0.8?"好叻呀！差少少就滿分！":pct>=0.6?"唔錯呀！繼續努力！":"完成咗！多練習一定進步！";
    $("finSummary").innerHTML = "⭐ "+S.stars+" / "+S.totalFirst+" 題一次答啱　🔥 最高連續 "+S.best+" 題";
    var rows = "";
    Object.keys(S.stats).forEach(function(t){
      var s = S.stats[t]; if (!s.total) return;
      var name = TOPICS[t] ? TOPICS[t].icon+" "+TOPICS[t].name : t;
      rows += "<tr><td>"+name+"</td><td>"+s.total+"</td><td>"+s.ok+"</td></tr>";
    });
    $("sumTable").innerHTML = "<tr><th>主題</th><th>題數</th><th>一次答啱</th></tr>"+rows;
    var box = $("missedBox"); box.innerHTML="";
    var keys = Object.keys(S.missed);
    if (!keys.length) box.innerHTML = '<p style="text-align:center;color:#2e7d32;font-weight:bold">🥇 Perfect！</p>';
    else {
      box.innerHTML = '<p style="font-weight:bold;color:#e65100">📝 要多練習：</p>';
      keys.forEach(function(w){
        var d=document.createElement("div"); d.className="missed";
        d.innerHTML = "<b>"+w+"</b> <small>（錯 "+S.missed[w]+" 次）</small>";
        box.appendChild(d);
      });
    }
    confetti(pct>=0.8?28:10);
  }

  function confetti(n) {
    var icons=["🎉","⭐","🌟","🎊","📚","✍️","🌈"];
    for (var i=0;i<n;i++){
      var s=document.createElement("span"); s.className="confetti";
      s.textContent=icons[Math.floor(Math.random()*icons.length)];
      s.style.left=Math.random()*100+"vw"; s.style.animationDuration=(1.4+Math.random()*2)+"s";
      document.body.appendChild(s);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },4000); })(s);
    }
  }

  $("againBtn").addEventListener("click", function(){ start(S.group); });
  $("backBtn").addEventListener("click", function(){ show("home"); });
  $("homeBtn").addEventListener("click", function(){ if(confirm("要返回主題選單嗎？今輪進度會冇咗。")) show("home"); });
  $("nextBtn").addEventListener("click", next);
  if ($("speakBtn")) $("speakBtn").addEventListener("click", function () {
    if (!S || !S.current) return;
    var it = S.current.item;
    if (S.answered) speakText(($("sentence").innerText||"").replace(/\([^)]*\)/g,""));
    else speakText(($("sentence").innerText||"").replace(/______/g,"blank"));
  });
  document.addEventListener("keydown", function(e){
    if ($("quiz").classList.contains("hidden")||!S||!S.current) return;
    if (e.key==="Enter" && S.answered) { e.preventDefault(); next(); return; }
    if (!S.answered && /^[1-4]$/.test(e.key)) {
      var b=$("choices").children[+e.key-1]; if (b) b.click();
    }
  });

  renderHome();
})();
</script>
</body>
</html>

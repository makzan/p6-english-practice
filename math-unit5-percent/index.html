<title>小六數學 第5課 分數、小數、百分數互化 練習</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {

  }
  h1 { text-align: center; font-size: clamp(1.3rem, 5vw, 2.1rem); color: #1b5e20; text-shadow: 2px 2px 0 #fff; margin: 6px 0 2px; }

  table.sum { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 1.05rem; }
  table.sum th, table.sum td { padding: 8px 6px; text-align: center; border-bottom: 2px solid #e0e0e0; }
  table.sum th { background: #e8f5e9; color: #1b5e20; }
  .bigemoji { font-size: 4rem; text-align: center; animation: bounce 1s infinite; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .row .big { margin: 10px 0 0; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .confetti { position: fixed; top: -30px; font-size: 1.7rem; pointer-events: none; animation: fall linear forwards; z-index: 99; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }
  @media (max-width: 420px) { .kbox { min-width: 90px; height: 56px; font-size: 1.7rem; } .key { font-size: 1.6rem; } }

<body>
<h1>🧮 小六數學 第5課 🍕</h1>
<div class="sub">分數、小數、百分數互化 大挑戰！</div>

<div class="card" id="home">
  <div class="intro">
    👋 揀一個練習主題，每輪 <b>15 題</b>。<br>
    ✅ 答啱有 ⭐，連續答啱有 🔥！<br>
    ❌ 答錯會睇到<b>詳細步驟</b>，之後再出一條類似嘅題目畀你再試。
  </div>
  <div class="topics" id="topics"></div>
</div>

<div class="card hidden" id="quiz">
  <div class="topbar">
    <button class="homebtn" id="homeBtn">🏠 返回</button>
    <span class="pill" id="progTxt">1 / 15</span>
    <span class="pill star">⭐ <span id="stars">0</span></span>
    <span class="pill fire">🔥 <span id="streak">0</span></span>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div><span class="tag" id="tag"></span><span class="retry hidden" id="retryTag">🔁 再試類似題</span></div>
  <div class="prompt" id="prompt"></div>
  <div class="expr" id="expr"></div>
  <div class="figbox" id="figure"></div>
  <div class="hint hidden" id="hint"></div>

  <div class="mcq hidden" id="mcq"></div>

  <div class="hidden" id="keypad">
    <div class="ansrow">
      <div class="kbox w" data-k="w" data-ph="整數"></div>
      <div class="kfrac">
        <div class="kbox" data-k="n" data-ph="分子"></div>
        <div class="kline"></div>
        <div class="kbox" data-k="d" data-ph="分母"></div>
      </div>
    </div>
    <div class="ktip">👆 先撳格仔，再撳數字。冇整數部分可以留空。</div>
    <div class="keys" id="keys"></div>
    <button class="big submit" id="submitBtn">✔ 提交答案</button>
  </div>

  <div class="feedback" id="feedback"></div>
  <div id="why"></div>
  <button class="linkbtn hidden" id="showSolBtn">📖 睇解題步驟</button>
  <div class="solution hidden" id="solution"></div>
  <button class="big next hidden" id="nextBtn">下一題 ➡️</button>
</div>

<div class="card hidden" id="finish">
  <div class="bigemoji" id="finEmoji">🏆</div>
  <h2 style="text-align:center;color:#1b5e20;margin:6px 0" id="finTitle">完成！</h2>
  <p style="text-align:center;font-size:1.2rem" id="finSummary"></p>
  <table class="sum" id="sumTable"></table>
  <div class="row">
    <button class="big submit" id="againBtn">🔄 再玩一次</button>
    <button class="big next" id="backBtn">🏠 揀其他主題</button>
  </div>
</div>
<script>
var MathCore = (function () {
  "use strict";
  // ---------- random helpers ----------
  var rand = Math.random;
  function setRandom(fn) { rand = fn; }
  function rnd(a, b) { return a + Math.floor(rand() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
  function chance(p) { return rand() < p; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function wpick(items) {
    var tot = 0, i;
    for (i = 0; i < items.length; i++) tot += items[i][0];
    var r = rand() * tot;
    for (i = 0; i < items.length; i++) { r -= items[i][0]; if (r < 0) return items[i][1]; }
    return items[items.length - 1][1];
  }
  function nonMult(lo, hi, m) { var k; do { k = rnd(lo, hi); } while (k % m === 0); return k; }

  // ---------- exact fractions ----------
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
  function lcm(a, b) { return a / gcd(a, b) * b; }
  function Frac(n, d) {
    if (d === undefined) d = 1;
    if (!Number.isInteger(n) || !Number.isInteger(d)) throw new Error("non-integer " + n + "/" + d);
    if (d === 0) throw new Error("division by zero");
    if (d < 0) { n = -n; d = -d; }
    var g = gcd(n, d) || 1;
    this.n = n / g; this.d = d / g;
    if (!Number.isSafeInteger(this.n) || !Number.isSafeInteger(this.d)) throw new Error("overflow");
  }
  function F(n, d) { return new Frac(n, d); }
  Frac.prototype.add = function (o) { return F(this.n * o.d + o.n * this.d, this.d * o.d); };
  Frac.prototype.sub = function (o) { return F(this.n * o.d - o.n * this.d, this.d * o.d); };
  Frac.prototype.mul = function (o) { return F(this.n * o.n, this.d * o.d); };
  Frac.prototype.div = function (o) { if (o.n === 0) throw new Error("division by zero"); return F(this.n * o.d, this.d * o.n); };
  Frac.prototype.eq = function (o) { return this.n === o.n && this.d === o.d; };
  Frac.prototype.isInt = function () { return this.d === 1; };
  Frac.prototype.isTerm = function () { var d = this.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; };
  Frac.prototype.decPlaces = function () { if (!this.isTerm()) return Infinity; var p = 1, k = 0; while (p % this.d !== 0) { p *= 10; k++; } return k; };
  Frac.prototype.toNumber = function () { return this.n / this.d; };
  Frac.prototype.toString = function () { return this.d === 1 ? String(this.n) : this.n + "/" + this.d; };
  var HUNDRED = F(100);

  function decStr(f) {
    if (!f.isTerm()) throw new Error("not terminating: " + f);
    var k = f.decPlaces(), p = Math.pow(10, k);
    var N = f.n * (p / f.d), neg = N < 0;
    var s = String(Math.abs(N));
    if (k > 0) { while (s.length <= k) s = "0" + s; s = s.slice(0, s.length - k) + "." + s.slice(s.length - k); }
    return (neg ? "−" : "") + s;
  }

  // ---------- HTML rendering ----------
  function fracH(n, d) { return '<span class="fr"><span class="fn">' + n + '</span><span class="fd">' + d + '</span></span>'; }
  function mixedH(f) {
    var sign = f.n < 0 ? "−" : "", n = Math.abs(f.n), d = f.d;
    if (d === 1) return sign + n;
    var w = Math.floor(n / d), r = n - w * d;
    return '<span class="num">' + sign + (w ? '<span class="mw">' + w + '</span>' : "") + fracH(r, d) + '</span>';
  }
  function improperH(f) { return f.d === 1 ? String(f.n) : (f.n < 0 ? "−" : "") + fracH(Math.abs(f.n), f.d); }
  function pctH(f) { var P = f.mul(HUNDRED); return (P.isTerm() ? decStr(P) : mixedH(P)) + "%"; }
  function pctMixedH(f) { return mixedH(f.mul(HUNDRED)) + "%"; }
  function decH(f) { return decStr(f); }
  var OPH = { "+": "+", "−": "−", "×": "×", "÷": "÷" };

  function fmtDec(v) { return v.isTerm() && v.decPlaces() <= 6 ? decStr(v) : null; }
  function fmtPct(v) {
    var P = v.mul(HUNDRED);
    if (P.isTerm()) return P.decPlaces() <= 4 ? decStr(P) + "%" : null;
    return P.d <= 1000 ? mixedH(P) + "%" : null;
  }

  // ---------- options ----------
  function opt(vOrFn, fmtFn, why) {
    try {
      var v = typeof vOrFn === "function" ? vOrFn() : vOrFn;
      if (!v) return null;
      var h = fmtFn(v);
      if (h == null) return null;
      return { v: v, html: h, why: why || "" };
    } catch (e) { return null; }
  }
  function buildOptions(correct, cands, fallback) {
    var opts = [correct];
    function ok(c) {
      if (!c || !c.v || c.html == null) return false;
      if (c.v.n <= 0) return false;
      for (var i = 0; i < opts.length; i++) if (opts[i].v.eq(c.v) || opts[i].html === c.html) return false;
      return true;
    }
    var i;
    for (i = 0; i < cands.length && opts.length < 4; i++) if (ok(cands[i])) opts.push(cands[i]);
    for (i = 0; i < fallback.length && opts.length < 4; i++) if (ok(fallback[i])) opts.push(fallback[i]);
    if (opts.length < 4) throw new Error("not enough options");
    correct.correct = true;
    return shuffle(opts);
  }
  function deltaFallback(ans, deltas, fmtFn) {
    var out = [];
    deltas.forEach(function (d) {
      out.push(opt(function () { return ans.add(d); }, fmtFn, ""));
      out.push(opt(function () { return ans.sub(d); }, fmtFn, ""));
    });
    return shuffle(out);
  }
  function coprimeNum(d) { var n; do { n = rnd(1, d - 1); } while (gcd(n, d) !== 1); return n; }
  function properFrac(dens) { var d = pick(dens); return F(coprimeNum(d), d); }
  function step(note, html, detail) { return { note: note || "", html: html, detail: detail || "" }; }

  var TOPICS = {
    p2f: { name: "百分數 → 最簡分數", icon: "🍕" },
    f2p: { name: "分數 → 百分數", icon: "💯" },
    p2d: { name: "百分數 → 小數", icon: "🔽" },
    d2p: { name: "小數 → 百分數", icon: "🔼" },
    eq: { name: "邊個數值相等？", icon: "⭐" },
    fig: { name: "著色圖形", icon: "🥧" },
    calc: { name: "四則混合計算", icon: "🧮" }
  };

  // ======================================================
  // 1. % -> simplest fraction (keypad)
  // ======================================================
  function genP2F() {
    for (var tries = 0; tries < 100; tries++) {
      var kind = pick(["int", "int", "big", "dec1", "dec1", "dec2", "frac", "frac"]);
      var P, disp, steps = [];
      if (kind === "int") P = F(nonMult(1, 99, 100));
      else if (kind === "big") P = F(pick([110, 120, 125, 140, 150, 175, 180, 225, 245, 250, 290, 320, 350, 375, 412]));
      else if (kind === "dec1") P = F(chance(0.5) ? pick([125, 375, 625, 875, 25, 75, 54, 45, 15, 35, 175, 225, 62, 48, 12, 5]) : nonMult(1, 999, 10), 10);
      else if (kind === "dec2") P = F(pick([8, 25, 4, 5, 12, 16, 75, 125, 2, 45, 36, 64]), 100);
      else { var c = pick([3, 3, 6, 7, 9, 3]); var b = coprimeNum(c); var w = chance(0.75) ? rnd(1, 66) : 0; P = F(w * c + b, c); }
      var ans = P.div(HUNDRED);
      if (ans.isInt()) continue;
      disp = (kind === "frac" ? mixedH(P) : decStr(P)) + "%";
      var simp = '<b>' + improperH(ans) + '</b>' + (ans.n > ans.d ? ' = <b>' + mixedH(ans) + '</b>' : "");
      if (kind === "int" || kind === "big") {
        var g = gcd(P.n, 100);
        steps.push(step("百分數 = 以 100 為分母嘅分數", disp + " = " + fracH(P.n, 100)));
        steps.push(step(g > 1 ? "約簡：分子分母同時除以 " + g : "已經係最簡", "= " + simp));
      } else if (kind === "dec1" || kind === "dec2") {
        var m = kind === "dec1" ? 10 : 100, top = P.mul(F(m)).n, bot = 100 * m;
        steps.push(step("先寫成分母 100 嘅分數", disp + " = " + fracH(decStr(P), 100)));
        steps.push(step("分子有小數：分子分母同時乘以 " + m, "= " + fracH(top, bot)));
        steps.push(step("約簡：分子分母同時除以 " + gcd(top, bot), "= " + simp));
      } else {
        steps.push(step(P.n > P.d ? "帶分數先化成假分數" : "", disp + " = " + improperH(P) + "%"));
        steps.push(step("% 即係 × " + fracH(1, 100), "= " + improperH(P) + " × " + fracH(1, 100) + " = " + fracH(P.n, P.d * 100)));
        steps.push(step("約簡成最簡分數", "= " + simp));
      }
      return {
        topic: "p2f", kind: "key", requireSimplest: true,
        prompt: "把百分數化成<b>最簡分數</b>：", expr: disp + " = ？",
        answer: ans, answerH: mixedH(ans), steps: steps, errors: [
          { v: P, why: "記得要除以 100（% 即係 " + fracH(1, 100) + "）！" },
          { v: P.div(F(10)), why: "小數點位置錯咗，% 係除以 100 呀！" }
        ], meta: { P: P }
      };
    }
    throw new Error("genP2F failed");
  }

  // ======================================================
  // 2. fraction -> % (MCQ)
  // ======================================================
  function genF2P() {
    var kind = pick(["term", "term", "non", "non", "mixed", "mixed", "unsimp"]);
    var n, d, w = 0;

    var q = { topic: "calc", tkey: tkey, tree: t, prompt: mcq ? "計算：" : "計算（答案用<b>最簡分數</b>或帶分數表示）：", expr: exprH(t), answer: ans, steps: sol.steps, errors: errs };

  var WHY_LTR = "你由左至右計咗！記住：<b>先乘除，後加減</b>（有括號先計括號）。";

<script>
(function () {
  "use strict";
  var M = MathCore;
  var ROUND = 15, MAX_RETRY = 3;
  var GOOD = ["🌟 好叻呀！", "🎉 完全正確！", "💯 犀利！", "🚀 勁呀！", "👏 做得好！", "😎 冇難到你！", "🧠 數學小天才！"];
  var BAD = ["💪 唔緊要，睇吓步驟！", "🙂 差少少！一齊睇吓點計。", "🌱 錯咗先學得識！", "🤗 加油！等陣再試一條類似嘅。"];
  function $(id) { return document.getElementById(id); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function show(id) { ["home", "quiz", "finish"].forEach(function (s) { $(s).classList.toggle("hidden", s !== id); }); window.scrollTo(0, 0); }

  var S = null; // state
  var input = { w: "", n: "", d: "", act: "n" };

  // ----- home -----
  var order = ["mix", "p2f", "f2p", "pd", "fig", "calc"];
  order.forEach(function (k) {
    var g = M.GROUPS[k], b = document.createElement("button");
    b.className = "topic" + (k === "mix" ? " mix" : "");
    b.innerHTML = '<span class="ti">' + g.icon + "</span>" + g.name;
    b.addEventListener("click", function () { start(k); });
    $("topics").appendChild(b);
  });

  function start(groupKey) {
    var qs;
    try { qs = M.buildRound(groupKey, ROUND); } catch (e) { alert("出題出錯，請再試一次"); return; }
    qs.forEach(function (q) { q.attempt = 0; });
    S = { group: groupKey, queue: qs, current: null, done: 0, stars: 0, streak: 0, best: 0, stats: {}, answered: false };
    show("quiz");
    next();
  }

  function stat(topic) { return S.stats[topic] || (S.stats[topic] = { total: 0, first: 0, wrong: 0 }); }

  function updateBar() {
    var total = S.done + S.queue.length + (S.current ? 1 : 0);
    $("progTxt").textContent = "第 " + Math.min(S.done + 1, total) + " / " + total + " 題";
    $("bar").style.width = Math.round(S.done / total * 100) + "%";
    $("stars").textContent = S.stars;
    $("streak").textContent = S.streak;
  }

  function next() {
    S.current = S.queue.shift() || null;
    if (!S.current) { finish(); return; }
    var q = S.current;
    S.answered = false;
    q.attempt = q.attempt || 0;
    if (q.attempt === 0) stat(q.topic).total++;
    $("tag").textContent = M.TOPICS[q.topic].icon + " " + M.TOPICS[q.topic].name;
    $("retryTag").classList.toggle("hidden", q.attempt === 0);
    $("prompt").innerHTML = q.prompt;
    $("expr").innerHTML = q.expr || "";
    $("expr").classList.toggle("hidden", !q.expr);
    $("figure").innerHTML = q.figure || "";
    $("hint").innerHTML = q.hint || "";
    $("hint").classList.toggle("hidden", !q.hint);
    $("feedback").textContent = ""; $("feedback").className = "feedback";
    $("why").innerHTML = "";
    $("solution").classList.add("hidden"); $("solution").innerHTML = "";
    $("showSolBtn").classList.add("hidden");
    $("nextBtn").classList.add("hidden");
    if (q.kind === "mcq") {
      $("keypad").classList.add("hidden");
      var box = $("mcq"); box.innerHTML = ""; box.classList.remove("hidden");
      q.options.forEach(function (o) {
        var b = document.createElement("button");
        b.className = "opt"; b.innerHTML = o.html;
        b.addEventListener("click", function () { answerMCQ(o, b); });
        o.btn = b; box.appendChild(b);
      });
    } else {
      $("mcq").classList.add("hidden");
      $("keypad").classList.remove("hidden");
      $("submitBtn").classList.remove("hidden");
      input = { w: "", n: "", d: "", act: "n" };
      renderInput();
    }
    updateBar();
  }

  function answerMCQ(o, btn) {
    if (S.answered) return;
    S.current.options.forEach(function (x) { x.btn.disabled = true; if (x.correct) x.btn.classList.add("right"); });
    if (o.correct) { btn.classList.add("pop"); resolve(true, ""); }
    else { btn.classList.add("wrong"); resolve(false, o.why); }
  }

  function resolve(correct, why) {
    var q = S.current;
    S.answered = true;
    var fb = $("feedback");
    if (correct) {
      if (q.attempt === 0) { stat(q.topic).first++; S.stars++; }
      S.streak++; if (S.streak > S.best) S.best = S.streak;
      fb.className = "feedback good";
      fb.innerHTML = pick(GOOD) + (S.streak >= 3 ? " 🔥 連續 " + S.streak + " 題！" : "");
      $("showSolBtn").classList.remove("hidden");
      confetti(S.streak >= 5 ? 16 : 8);
    } else {
      stat(q.topic).wrong++;
      S.streak = 0;
      fb.className = "feedback bad";
      fb.innerHTML = pick(BAD) + '<div style="margin-top:6px;color:#2e7d32">正確答案：<span style="font-size:1.4em">' + q.answerH + "</span></div>";
      if (why) $("why").innerHTML = '<div class="why">💡 ' + why + "</div>";

      if (q.attempt < MAX_RETRY) {
        try { var nq = q.regen(); nq.attempt = q.attempt + 1; S.queue.push(nq); } catch (e) { /* ignore */ }
      }

    $("submitBtn").classList.add("hidden");
    S.done++;
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").textContent = S.queue.length ? "下一題 ➡️" : "睇成績 🏆";
    updateBar();
  }

  function renderSolution() {
    var q = S.current, h = "<h3>📖 解題步驟</h3>";
    q.steps.forEach(function (s) {
      h += '<div class="step">' + (s.note ? '<div class="snote">▶ ' + s.note + "</div>" : "") + '<div class="shtml">' + s.html + "</div>" + (s.detail ? '<div class="sdetail">' + s.detail + "</div>" : "") + "</div>";

    $("solution").innerHTML = h;
    $("solution").classList.remove("hidden");
    $("showSolBtn").classList.add("hidden");
  }

  // ----- keypad -----
  var keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "清除"];
  keys.forEach(function (k) {
    var b = document.createElement("button");
    b.className = "key" + (k === "⌫" || k === "清除" ? " fn" : "");
    b.textContent = k;
    b.addEventListener("click", function () { press(k); });
    $("keys").appendChild(b);
  });
  Array.prototype.forEach.call(document.querySelectorAll(".kbox"), function (el) {
    el.addEventListener("click", function () { if (S && !S.answered) { input.act = el.getAttribute("data-k"); renderInput(); } });
  });
  function press(k) {
    if (!S || S.answered) return;

  }
  function renderInput() {
    Array.prototype.forEach.call(document.querySelectorAll(".kbox"), function (el) {

      el.classList.toggle("act", k === input.act);
    });
  }
  $("submitBtn").addEventListener("click", submitKey);
  function submitKey() {
    if (!S || S.answered) return;
    var r = M.checkFrac(input, S.current), fb = $("feedback");
    if (r.status === "invalid") { fb.className = "feedback info"; fb.innerHTML = r.msg; return; }
    if (r.status === "notSimplest") { fb.className = "feedback info"; fb.innerHTML = "🤏 " + r.msg; return; }
    resolve(r.status === "correct", r.why || "");
  }

  // physical keyboard support
  document.addEventListener("keydown", function (e) {
    if ($("quiz").classList.contains("hidden")) return;
    if (e.key === "Enter") { e.preventDefault(); if (S.answered) $("nextBtn").click(); else if (S.current.kind === "key") submitKey(); return; }
    if (S.answered || S.current.kind !== "key") { if (!S.answered && S.current.kind === "mcq" && /^[1-4]$/.test(e.key)) S.current.options[+e.key - 1].btn.click(); return; }
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") { e.preventDefault(); press("⌫"); }
    else if (e.key === "Tab" || e.key === "ArrowDown" || e.key === "ArrowUp" || e.key === "/") { e.preventDefault(); var o = ["w", "n", "d"]; input.act = o[(o.indexOf(input.act) + (e.key === "ArrowUp" ? 2 : 1)) % 3]; renderInput(); }
  });

  $("showSolBtn").addEventListener("click", renderSolution);
  $("nextBtn").addEventListener("click", next);
  $("homeBtn").addEventListener("click", function () { if (confirm("要返回主頁嗎？今輪進度會冇咗。")) show("home"); });
  $("againBtn").addEventListener("click", function () { start(S.group); });
  $("backBtn").addEventListener("click", function () { show("home"); });

  function finish() {
    show("finish");
    var firstQs = 0, firstOk = 0, rows = "";
    Object.keys(M.TOPICS).forEach(function (t) {
      var s = S.stats[t]; if (!s) return;
      firstQs += s.total; firstOk += s.first;
      rows += "<tr><td>" + M.TOPICS[t].icon + " " + M.TOPICS[t].name + "</td><td>" + s.total + "</td><td>" + s.first + "</td><td>" + s.wrong + "</td><td>" + (s.first === s.total ? "🌟" : s.first / s.total >= 0.6 ? "👍" : "💪") + "</td></tr>";
    });

    var pct = firstQs ? firstOk / firstQs : 0;
    $("finEmoji").textContent = pct === 1 ? "🏆" : pct >= 0.8 ? "🥇" : pct >= 0.6 ? "🥈" : "💪";
    $("finTitle").textContent = pct === 1 ? "全部一次答啱！超級犀利！" : pct >= 0.8 ? "好叻呀！差少少就滿分！" : pct >= 0.6 ? "唔錯呀！繼續努力！" : "完成咗！多練幾次一定會進步！";
    $("finSummary").innerHTML = "⭐ " + S.stars + " / " + firstQs + " 題一次答啱　🔥 最高連續 " + S.best + " 題";
    confetti(pct >= 0.8 ? 40 : 15);
  }

  function confetti(n) {
    var icons = ["🎉", "⭐", "🌟", "🎊", "💯", "🍕", "🌈"];
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "confetti";
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = (1.4 + Math.random() * 2) + "s";
      document.body.appendChild(s);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4000); })(s);
    }
  }
  window.__app = { start: start, state: function () { return S; }, press: press, submitKey: submitKey, input: function () { return input; } };
})();

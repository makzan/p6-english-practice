<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Exam Revision Vocabulary 2 · Passage Fill</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {

  .sub { text-align: center; color: #2e7d32; margin: 0 0 14px; font-size: 1.02rem; }
  .card { background: #fff; border-radius: 26px; max-width: 780px; margin: 0 auto; padding: 20px 16px 24px; box-shadow: 0 10px 28px rgba(0,80,40,.2); border: 5px solid #81c784; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }

  .topic { background: #e8f5e9; border-radius: 18px; padding: 14px 10px; font-size: 1.08rem; font-weight: bold; color: #1b5e20; box-shadow: 0 5px 0 #a5d6a7; text-align: left; }
  .topic .ti { font-size: 1.8rem; display: block; margin-bottom: 2px; }
  .topic:active { transform: translateY(3px); box-shadow: 0 2px 0 #a5d6a7; }
  .topic.mix { grid-column: 1 / -1; background: #fff3e0; color: #e65100; box-shadow: 0 5px 0 #ffb74d; }
  .topic .desc { font-size: .82rem; font-weight: normal; margin-top: 4px; color: #555; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .modebtn { background: #c8e6c9; color: #1b5e20; border-radius: 999px; padding: 8px 14px; font-weight: bold; font-size: .95rem; box-shadow: 0 3px 0 #81c784; }
  .modebtn.on { background: #43a047; color: #fff; }
  .topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { background: #e8f5e9; border-radius: 999px; padding: 6px 12px; font-weight: bold; color: #1b5e20; font-size: .95rem; }
  .pill.star { background: #fff8e1; color: #f57f17; }
  .pill.fire { background: #fbe9e7; color: #d84315; }
  .homebtn { background: #eceff1; border-radius: 999px; padding: 6px 12px; font-size: 1rem; }
  .bar { flex: 1 1 100%; height: 14px; background: #e0e0e0; border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #66bb6a, #26c6da); transition: width .35s; }
  .ptitle { font-size: 1.25rem; font-weight: bold; color: #1b5e20; margin: 4px 0 10px; text-align: center; }
  .passage {
    font-size: clamp(1.05rem, 3.8vw, 1.28rem); line-height: 1.85; color: #1a237e;
    background: #fffde7; border: 3px dashed #ffd54f; border-radius: 16px; padding: 14px 12px; margin-bottom: 12px;
  }
  .passage p { margin: 0 0 12px; }
  .blank {
    display: inline-block; min-width: 4.2em; padding: 1px 8px; margin: 0 2px;
    border-bottom: 3px solid #2e7d32; background: #c8e6c9; border-radius: 8px 8px 0 0;
    color: #1b5e20; font-weight: bold; text-align: center; cursor: pointer;
  }
  .blank.num { font-size: .75em; color: #888; font-weight: normal; margin-right: 2px; }
  .blank.open { background: #fff59d; border-bottom-color: #f9a825; box-shadow: 0 0 0 3px rgba(249,168,37,.35); }
  .blank.right { background: #a5d6a7; border-bottom-color: #1b5e20; color: #1b5e20; cursor: default; }
  .blank.wrong { background: #ffcdd2; border-bottom-color: #c62828; color: #b71c1c; }
  .blank.done { cursor: default; }
  .prompt { font-size: 1.05rem; color: #2e7d32; font-weight: bold; margin: 6px 0; }
  .sentence {
    font-size: clamp(1.15rem, 4.2vw, 1.5rem); line-height: 1.75; background: #e3f2fd;
    border-radius: 16px; padding: 14px; margin: 8px 0 10px; border: 3px dashed #64b5f6; color: #0d47a1; font-weight: 600;
  }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 560px) { .choices { grid-template-columns: 1fr 1fr 1fr; } }
  .choice {
    background: #e8f5e9; color: #1b5e20; font-size: clamp(1rem, 3.6vw, 1.22rem); font-weight: bold;
    border-radius: 16px; padding: 14px 8px; min-height: 56px; box-shadow: 0 5px 0 #a5d6a7;
  }
  .choice:active { transform: translateY(3px); box-shadow: 0 2px 0 #a5d6a7; }
  .choice.right { background: #c8e6c9; box-shadow: 0 5px 0 #66bb6a; }
  .choice.wrong { background: #ffcdd2; box-shadow: 0 5px 0 #e57373; color: #b71c1c; }
  .choice:disabled { cursor: default; }
  .speak { display: inline-block; margin: 6px 4px; background: #0288d1; color: #fff; font-size: 1.05rem; font-weight: bold; border-radius: 999px; padding: 10px 16px; box-shadow: 0 4px 0 #01579b; }
  .speak:active { transform: translateY(3px); box-shadow: 0 1px 0 #01579b; }
  .fb { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 10px; min-height: 1.3em; }
  .fb.good { color: #2e7d32; } .fb.bad { color: #c62828; }
  .why { background: #fff3e0; border-left: 6px solid #ff9800; border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 1.05rem; line-height: 1.6; text-align: left; }
  .why b { color: #e65100; }
  .mean { color: #546e7a; font-size: .95rem; }
  .next { display: block; margin: 14px auto 0; font-size: 1.3rem; font-weight: bold; color: #fff; background: #fb8c00; border-radius: 20px; padding: 14px 28px; box-shadow: 0 6px 0 #e65100; min-width: 200px; }
  .next:active { transform: translateY(4px); box-shadow: 0 2px 0 #e65100; }
  .start { font-size: 1.3rem; font-weight: bold; color: #fff; background: #43a047; border-radius: 20px; padding: 14px 28px; box-shadow: 0 6px 0 #2e7d32; }
  .picker { background: #e3f2fd; border-radius: 16px; padding: 12px; margin-top: 8px; border: 3px solid #64b5f6; }
  .picker h3 { margin: 0 0 8px; color: #1565c0; font-size: 1.1rem; }
  .bigemoji { font-size: 4rem; text-align: center; animation: bounce 1s infinite; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .row .next, .row .start { margin: 10px 0 0; }
  table.sum { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 1.05rem; }
  table.sum th, table.sum td { padding: 8px 6px; text-align: center; border-bottom: 2px solid #e0e0e0; }
  table.sum th { background: #e8f5e9; color: #1b5e20; }
  .missed { background: #fff8e1; border-radius: 12px; padding: 6px 10px; margin: 4px 0; font-size: .98rem; text-align: left; }
  .wordbank { font-size: .9rem; color: #555; background: #f1f8e9; border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.5; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .confetti { position: fixed; top: -30px; font-size: 1.7rem; pointer-events: none; animation: fall linear forwards; z-index: 99; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }
</style>

<body>
<h1>🐯 Exam Revision · Vocabulary 2 🌍</h1>
<div class="sub">Unit 2 Productive Vocabulary · Passage Fill</div>

<div class="card" id="home">
  <div class="intro">
    📖 用 Unit 2 生字填入短文空格。<br>
    🟢 <b>短文模式</b>：睇成段文章，撳空格再揀答案。<br>
    🔵 <b>逐題模式</b>：一次一格，集中練習。<br>
    ❌ 答錯有中文提示，之後會再出現。<br>
    🔊 聽句子唔會講出答案（答完先會）。
  </div>
  <div class="topics" id="topics"></div>
</div>

<div class="card hidden" id="quiz">
  <div class="topbar">
    <button class="homebtn" id="homeBtn">🏠 返回</button>
    <span class="pill" id="progTxt">0 / 0</span>
    <span class="pill star">⭐ <span id="stars">0</span></span>
    <span class="pill fire">🔥 <span id="streak">0</span></span>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div class="ptitle" id="ptitle"></div>
  <div class="wordbank" id="wordbank"></div>

  <!-- Passage mode -->
  <div id="passageMode">
    <div class="passage" id="passage"></div>
    <button class="speak" id="speakPassBtn">🔊 聽呢段（未答嘅空格讀 blank）</button>
    <div class="picker hidden" id="picker">
      <h3 id="pickerTitle">揀答案</h3>
      <div class="choices" id="passChoices"></div>
      <div class="fb" id="passFb"></div>
      <div id="passWhy"></div>
    </div>
    <button class="next hidden" id="finishPassBtn">睇成績 🏆</button>
  </div>

  <!-- One-at-a-time mode -->
  <div id="oneMode" class="hidden">
    <div class="prompt" id="onePrompt">揀正確生字：</div>
    <div class="sentence" id="oneSentence"></div>
    <button class="speak" id="speakOneBtn">🔊 聽句子</button>
    <div class="choices" id="oneChoices"></div>
    <div class="fb" id="oneFb"></div>
    <div id="oneWhy"></div>
    <button class="next hidden" id="oneNextBtn">下一題 ➡️</button>
  </div>
</div>

<div class="card hidden" id="finish">
  <div class="bigemoji" id="finEmoji">🏆</div>
  <h2 style="text-align:center;color:#1b5e20;margin:6px 0" id="finTitle">完成！</h2>
  <p style="text-align:center;font-size:1.2rem" id="finSummary"></p>
  <table class="sum" id="sumTable"></table>
  <div id="missedBox"></div>
  <div class="row">
    <button class="start" id="againBtn">🔄 再玩一次</button>
    <button class="next" id="backBtn">🏠 返回主頁</button>
  </div>
</div>

      var out = {};
      ["p1","p2"].forEach(function (pid) {
        out[pid] = PASSAGES[pid].blanks.map(function (b) { return { n: b.n, answer: b.answer }; });
      });
      return out;
    }
  };
})();
</script>

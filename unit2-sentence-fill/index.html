<h1>🐢 Unit 2 Vocabulary · Sentence Fill 🌊</h1>
<div class="sub">揀啱生字，填入句子！Save the Animals!</div>

<div class="card" id="home">
  <div class="intro">
    📖 每題一句英文句子，有一個空格。<br>
    🔘 從 <b>6 個生字</b>入面揀啱嗰個填入。<br>
    🔊 可以撳「聽句子」聽讀音。<br>
    ❌ 答錯會睇到正確答案同中文提示，之後再出一條類似題。<br>

  </div>
  <p style="text-align:center;color:#00695c;font-weight:bold" id="bankInfo"></p>
  <button class="start" id="startBtn">🚀 開始！</button>
</div>

<div class="card hidden" id="quiz">

    <button class="homebtn" id="homeBtn">🏠 返回</button>

  </div>

  <div class="sentence" id="sentence"></div>
  <button class="speak" id="speakBtn">🔊 聽句子</button>
  <div class="choices" id="choices"></div>
  <div class="fb" id="fb"></div>
  <div id="why"></div>
  <button class="next hidden" id="nextBtn">下一題 ➡️</button>
</div>

<div class="card hidden" id="finish">

  <p style="text-align:center;font-size:1.2rem" id="finSummary"></p>
  <div id="missedBox"></div>
  <div class="row">
    <button class="start" id="againBtn">🔄 再玩一次</button>
    <button class="next" id="backBtn">🏠 返回主頁</button>
  </div>
</div>

    { id: "n15", before: "A big forest fire can ", after: " whole villages and animal homes.", answer: "burn down", tip: "燒毀 → <b>burn down</b>。", pool: ["cut down", "dump into", "speak up", "take action", "preserve"], note: "（片語）" },
    { id: "n16", before: "Students should ", after: " when they see someone throwing rubbish into the sea.", answer: "speak up", tip: "敢於開口反對 → <b>speak up</b>。", pool: ["cut down", "burn down", "dump into", "take action", "refuse"], note: "（片語）" },
    { id: "n17", before: "We must ", after: " now to stop plastic pollution before it is too late.", answer: "take action", tip: "採取實際行動 → <b>take action</b>。", pool: ["speak up", "cut down", "burn down", "dump into", "refuse"], note: "（片語）" },
    { id: "n18", before: "Our school raised money for a wildlife ", after: " that rescues injured animals.", answer: "charity", tip: "慈善機構 → <b>charity</b>。", pool: ["volunteer", "policy", "habitat", "shelter", "species"] },
    { id: "n19", before: "You can ", after: " old clothes to people in need instead of throwing them away.", answer: "donate", tip: "捐贈衣物／錢 → <b>donate</b>。呢度後面接「舊衫」，唔係 support。", pool: ["support", "refuse", "inspire", "capture", "pollute"] },
    { id: "n20", before: "Please do not ", after: " to help. Every small action can make a difference!", answer: "refuse", tip: "唔好拒絕幫忙 → <b>refuse</b>。", pool: ["donate", "inspire", "support", "preserve", "capture"] },
    { id: "n21", before: "Posters and videos can ", after: " awareness about protecting sharks.", answer: "raise", tip: "提高意識 → <b>raise</b> awareness。", pool: ["inspire", "persuade", "refuse", "donate", "damage"] },
    { id: "n22", before: "Can you ", after: " your parents to use reusable shopping bags?", answer: "persuade", tip: "說服人去做 → <b>persuade</b>。", pool: ["inspire", "refuse", "donate", "capture", "damage"] },

    // === Receptive vocab sentences ===
    { id: "r1", before: "Every living thing is part of an ", after: ", and together they form the rich biodiversity of our world.", answer: "ecosystem", tip: "動植物互相依存嘅「生態系」→ <b>ecosystem</b>。呢度講 living things 之間嘅關係，唔係廣義嘅 environment。", pool: ["environment", "habitat", "shelter", "population", "conservation"] },
    { id: "r2", before: "The rich ", after: " of our world includes millions of different plants and animals.", answer: "biodiversity", tip: "生物多樣性 → <b>biodiversity</b>。", pool: ["population", "ecosystem", "conservation", "deforestation", "habitat"] },
    { id: "r3", before: "", after: " is a big problem because we cut down too many trees for farms and buildings.", answer: "Deforestation", tip: "大規模砍伐森林 → <b>Deforestation</b>。", pool: ["Conservation", "Biodiversity", "Population", "Pollution", "Education"], forms: true },
    { id: "r4", before: "Floods, earthquakes and forest fires are examples of ", after: ".", answer: "natural disasters", tip: "天災 → <b>natural disasters</b>。", pool: ["carbon footprint", "carbon emission", "conservation", "biodiversity", "deforestation"] },
    { id: "r5", before: "The human ", after: " is growing, so we need more food, water and space.", answer: "population", tip: "人口 → <b>population</b>。", pool: ["biodiversity", "conservation", "ecosystem", "habitat", "species"] },
    { id: "r6", before: "Many ", after: " projects are working to protect nature and wildlife.", answer: "conservation", tip: "保育計劃 → <b>conservation</b>。", pool: ["deforestation", "population", "biodiversity", "reptiles", "amphibians"] },
    { id: "r7", before: "Snakes and lizards are ", after: ". They are cold-blooded and usually have dry skin.", answer: "reptiles", tip: "爬蟲類 → <b>reptiles</b>。青蛙係 amphibians。", pool: ["amphibians", "mammals", "species", "habitats", "volunteers"], forms: true },
    { id: "r8", before: "Frogs and toads are ", after: " because they can live both on land and in water.", answer: "amphibians", tip: "兩棲類 → <b>amphibians</b>。", pool: ["reptiles", "mammals", "species", "habitats", "volunteers"], forms: true },
    { id: "r9", before: "Walking to school instead of taking a car can reduce your ", after: ".", answer: "carbon footprint", tip: "個人產生嘅碳排放總量 → <b>carbon footprint</b>（碳足跡）。", pool: ["carbon emission", "natural disasters", "biodiversity", "conservation", "population"] },
    { id: "r10", before: "Factories should reduce their ", after: " to fight climate change.", answer: "carbon emission", tip: "工廠排放嘅二氧化碳 → <b>carbon emission</b>（碳排放）。", pool: ["carbon footprint", "natural disasters", "biodiversity", "conservation", "population"] }
  ];

  // "inspires" / "persuades" etc. — tip forms in VOCAB lookup
  function lookup(word) {
    var k = word.toLowerCase();
    if (VOCAB[k]) return VOCAB[k];
    // strip common verb endings
    if (VOCAB[k.replace(/s$/, "")]) return VOCAB[k.replace(/s$/, "")];
    if (VOCAB[k.replace(/es$/, "")]) return VOCAB[k.replace(/es$/, "")];
    if (VOCAB[k.replace(/ies$/, "y")]) return VOCAB[k.replace(/ies$/, "y")];
    return null;
  }
  function zhOf(word) { var v = lookup(word); return v ? v.zh : ""; }
  function enOf(word) { var v = lookup(word); return v ? v.en : ""; }

  var ROUND = 15, MAX_RETRY = 2;
  var GOOD = ["🌟 好叻呀！", "🎉 完全正確！", "💯 犀利！", "🚀 勁呀！", "👏 Excellent!", "😎 Well done!", "🐢 海龜都讚你！"];
  var BAD = ["💪 唔緊要，睇吓提示！", "🙂 差少少！記住呢個分別啦！", "🌱 錯咗先學得識！", "🤗 加油！等陣再試！"];

  function $(id) { return document.getElementById(id); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function show(id) { ["home", "quiz", "finish"].forEach(function (s) { $(s).classList.toggle("hidden", s !== id); }); window.scrollTo(0, 0); }

  // Build 6 options for an item
  function buildChoices(item) {
    var correct = item.answer;
    var opts = [correct];
    var pool = (item.pool || []).slice();
    // add confuse pair
    var conf = CONFUSE[correct.toLowerCase()];
    if (conf && opts.indexOf(conf) < 0 && opts.indexOf(capLike(conf, correct)) < 0) pool.unshift(capLike(conf, correct));
    pool = shuffle(pool);
    for (var i = 0; i < pool.length && opts.length < 6; i++) {
      var w = pool[i];
      if (!w) continue;
      w = capLike(w, correct);
      if (opts.indexOf(w) >= 0) continue;
      if (w.toLowerCase() === correct.toLowerCase()) continue;
      opts.push(w);
    }
    // fill from same POS / random vocab if needed
    var keys = shuffle(Object.keys(VOCAB));
    for (var k = 0; k < keys.length && opts.length < 6; k++) {
      var cand = capLike(keys[k], correct);
      if (opts.indexOf(cand) >= 0) continue;
      if (cand.toLowerCase() === correct.toLowerCase()) continue;
      opts.push(cand);
    }
    return shuffle(opts);
  }
  function capLike(word, model) {
    if (model[0] === model[0].toUpperCase() && model[0] !== model[0].toLowerCase()) {
      return word.charAt(0).toUpperCase() + word.slice(1);
    }
    return word;
  }

  // Speech
  var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
  var voice = null;
  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices() || [];
    var prefs = [
      function (v) { return /en-GB/i.test(v.lang) && /google|natural|daniel/i.test(v.name); },
      function (v) { return /en-GB/i.test(v.lang); },
      function (v) { return /en-US/i.test(v.lang); },
      function (v) { return /^en/i.test(v.lang); }
    ];
    for (var i = 0; i < prefs.length; i++) for (var j = 0; j < vs.length; j++) if (prefs[i](vs[j])) { voice = vs[j]; return; }
  }
  if (synth) {
    pickVoice();
    if (synth.addEventListener) synth.addEventListener("voiceschanged", pickVoice);
    else synth.onvoiceschanged = pickVoice;
  }
  function speakSentence(item, chosen) {
    if (!synth) return;
    if (!voice) pickVoice();
    var full;
    if (item.parts && chosen) full = item.before + item.parts[0] + item.mid + item.parts[1] + item.after;
    else if (item.parts) full = item.before + "blank" + item.mid + "blank" + item.after;
    else full = item.before + (chosen || "blank") + item.after;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(full);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
    u.rate = 0.85;
    setTimeout(function () { synth.speak(u); }, 50);
  }

  var S = null;

  $("bankInfo").textContent = "題庫共 " + ITEMS.length + " 條句子 📚";

  function start() {
    var qs = shuffle(ITEMS).slice(0, Math.min(ROUND, ITEMS.length)).map(function (it) {
      return { item: it, attempt: 0, choices: buildChoices(it) };
    });
    S = { queue: qs, current: null, done: 0, stars: 0, streak: 0, best: 0, missed: {}, totalFirst: qs.length };
    show("quiz");
    next();
  }

  function updateBar() {
    var total = S.done + S.queue.length + (S.current ? 1 : 0);
    $("progTxt").textContent = "第 " + Math.min(S.done + 1, total) + " / " + total + " 題";
    $("bar").style.width = Math.round(S.done / total * 100) + "%";
    $("stars").textContent = S.stars;
    $("streak").textContent = S.streak;
  }

  function renderSentence(item, fill, cls) {
    var c = "blank" + (cls ? " " + cls : "") + (fill ? " filled" : "");
    var html;
    if (item.parts && item.parts.length === 2) {
      var a = fill ? item.parts[0] : "______";
      var b = fill ? item.parts[1] : "______";
      html = item.before + '<span class="' + c + '">' + a + "</span>" + item.mid + '<span class="' + c + '">' + b + "</span>" + item.after;
    } else {
      html = item.before + '<span class="' + c + '">' + (fill || "______") + "</span>" + item.after;
    }
    if (item.note) html += ' <span class="mean">' + item.note + "</span>";
    $("sentence").innerHTML = html;
  }

  function next() {
    S.current = S.queue.shift() || null;
    if (!S.current) { finish(); return; }
    var q = S.current, item = q.item;
    S.answered = false;
    $("retryTag").classList.toggle("hidden", q.attempt === 0);
    renderSentence(item, null, "");
    $("fb").textContent = ""; $("fb").className = "fb";
    $("why").innerHTML = "";
    $("nextBtn").classList.add("hidden");
    var box = $("choices"); box.innerHTML = "";
    q.choices.forEach(function (w) {
      var b = document.createElement("button");
      b.className = "choice";
      b.textContent = (w.toLowerCase() === "dump into") ? "dump … into" : w;
      b.setAttribute("data-ans", w);
      b.addEventListener("click", function () { choose(b.getAttribute("data-ans"), b); });
      box.appendChild(b);
    });
    updateBar();
  }

  function choose(word, btn) {
    if (S.answered) return;
    S.answered = true;
    var q = S.current, item = q.item;
    var correct = word.toLowerCase() === item.answer.toLowerCase();
    Array.prototype.forEach.call($("choices").children, function (c) {
      c.disabled = true;
      if (c.textContent.toLowerCase() === item.answer.toLowerCase()) c.classList.add("right");
    });
    if (correct) {
      btn.classList.add("right");
      renderSentence(item, item.answer, "right");
      if (q.attempt === 0) S.stars++;
      S.streak++; if (S.streak > S.best) S.best = S.streak;
      $("fb").className = "fb good";
      $("fb").innerHTML = pick(GOOD) + (S.streak >= 3 ? " 🔥 連續 " + S.streak + " 題！" : "");
      confetti(S.streak >= 5 ? 14 : 7);
      speakSentence(item, item.answer);
    } else {
      btn.classList.add("wrong");
      renderSentence(item, word, "wrong");
      S.streak = 0;
      S.missed[item.answer] = (S.missed[item.answer] || 0) + 1;
      $("fb").className = "fb bad";
      $("fb").innerHTML = pick(BAD) + '<div style="margin-top:6px;color:#2e7d32">正確答案：<b>' + item.answer + "</b></div>";
      var mean = zhOf(item.answer);
      var tip = item.tip || "";
      var wrongZh = zhOf(word);
      $("why").innerHTML = '<div class="why">💡 ' + tip +
        (mean ? '<div class="mean" style="margin-top:6px"><b>' + item.answer + "</b> = " + mean + (enOf(item.answer) ? " · " + enOf(item.answer) : "") + "</div>" : "") +
        (wrongZh ? '<div class="mean">你揀咗 <b>' + word + "</b> = " + wrongZh + "</div>" : "") +
        "</div>";
      // requeue similar: prefer same answer family or random unused
      if (q.attempt < MAX_RETRY) {
        var similar = findSimilar(item, q.attempt);
        if (similar) S.queue.push({ item: similar, attempt: q.attempt + 1, choices: buildChoices(similar) });
      }
    }
    S.done++;
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").textContent = S.queue.length ? "下一題 ➡️" : "睇成績 🏆";
    updateBar();
  }

  function findSimilar(item, attempt) {
    // Prefer another item with same answer, else same confuse-pair answer, else random not-yet-seen-ish
    var used = {};
    if (S.current) used[S.current.item.id] = true;
    S.queue.forEach(function (q) { used[q.item.id] = true; });
    var same = ITEMS.filter(function (it) { return it.answer.toLowerCase() === item.answer.toLowerCase() && !used[it.id]; });
    if (same.length) return pick(same);
    var conf = CONFUSE[item.answer.toLowerCase()];
    if (conf) {
      var pair = ITEMS.filter(function (it) { return it.answer.toLowerCase() === conf && !used[it.id]; });
      if (pair.length) return pick(pair);
    }
    var rest = ITEMS.filter(function (it) { return !used[it.id]; });
    return rest.length ? pick(rest) : null;
  }

  function finish() {
    show("finish");
    var pct = S.totalFirst ? S.stars / S.totalFirst : 0;
    $("finEmoji").textContent = pct === 1 ? "🏆" : pct >= 0.8 ? "🥇" : pct >= 0.6 ? "🥈" : "💪";
    $("finTitle").textContent = pct === 1 ? "全部一次答啱！超級犀利！" : pct >= 0.8 ? "好叻呀！差少少就滿分！" : pct >= 0.6 ? "唔錯呀！繼續努力！" : "完成咗！多練幾次一定會進步！";
    $("finSummary").innerHTML = "⭐ " + S.stars + " / " + S.totalFirst + " 題一次答啱　🔥 最高連續 " + S.best + " 題";
    var box = $("missedBox"); box.innerHTML = "";
    var keys = Object.keys(S.missed);
    if (!keys.length) {
      box.innerHTML = '<p style="text-align:center;color:#2e7d32;font-weight:bold;font-size:1.2rem">🥇 全部一次答啱！Perfect！</p>';
    } else {
      box.innerHTML = '<p style="font-weight:bold;color:#e65100">📝 呢啲字要多啲練習：</p>';
      keys.forEach(function (w) {
        var d = document.createElement("div");
        d.className = "missed";
        d.innerHTML = "<b>" + w + "</b> " + zhOf(w) + " <small>（錯 " + S.missed[w] + " 次）</small>";
        box.appendChild(d);
      });
    }
    confetti(pct >= 0.8 ? 36 : 12);
  }

  function confetti(n) {
    var icons = ["🎉", "⭐", "🌟", "🎊", "🐢", "🌊", "🌈"];
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span");
      s.className = "confetti";
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = (1.4 + Math.random() * 2) + "s";
      document.body.appendChild(s);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4000); })(s);
    }
  }

  $("startBtn").addEventListener("click", start);
  $("againBtn").addEventListener("click", start);
  $("backBtn").addEventListener("click", function () { show("home"); });
  $("homeBtn").addEventListener("click", function () { if (confirm("要返回主頁嗎？今輪進度會冇咗。")) show("home"); });
  $("nextBtn").addEventListener("click", next);
  $("speakBtn").addEventListener("click", function () {
    if (!S || !S.current) return;
    var fill = S.answered ? S.current.item.answer : null;
    speakSentence(S.current.item, fill);
  });
  document.addEventListener("keydown", function (e) {
    if ($("quiz").classList.contains("hidden") || !S || !S.current) return;
    if (e.key === "Enter" && S.answered) { e.preventDefault(); next(); return; }
    if (!S.answered && /^[1-6]$/.test(e.key)) {
      var btn = $("choices").children[+e.key - 1];
      if (btn) btn.click();
    }
  });

  // Expose for tests
  window.__SF = {
    ITEMS: ITEMS, VOCAB: VOCAB, buildChoices: buildChoices, CONFUSE: CONFUSE,
    start: start, state: function () { return S; }
  };
})();
</script>
</body>
</html>

      before:"Before the test I ", after:" my notes carefully so I do not miss anything.",
      answer:"go through", letter:"d",
      tip:"仔細溫習／檢查筆記 → <b>go through</b>（d）。" },

    // ===== Extra sentences =====
    { id:"x1", topic:"sent", unit:"2",
      before:"We must not ", after:" too many trees, or animals will lose their homes.",
      answer:"cut down",
      pool:["dump into","burn down","tidy up","play fair","poach","capture"],
      tip:"砍倒樹 → <b>cut down</b>。" },
    { id:"x2", topic:"sent", unit:"2",
      before:"Please do not ", after:" plastic waste into the sea.",
      answer:"dump",
      pool:["dump into","pollute","poach","capture","damage","practise"],
      tip:"若句子已有 into，動詞用 <b>dump</b>（dump … into）。",
      // Actually better use dump into as whole - rewrite
    },
    { id:"x2b", topic:"sent", unit:"2",
      before:"Factories should not ", after:" rivers with waste.",
      answer:"pollute",
      pool:["poach","capture","preserve","damage","practise","exercise"],
      tip:"污染河流 → <b>pollute</b>。" },
    { id:"x3", topic:"sent", unit:"1",
      before:"Please ", after:" your desk before you go home.",
      answer:"tidy up",
      pool:["play fair","practise","exercise","be on time","go through","stay organised"],
      tip:"收拾書枱 → <b>tidy up</b>。" },
    { id:"x4", topic:"sent", unit:"1",
      before:"Good students always ", after:" for lessons.",
      answer:"are on time",
      pool:["am on time","be on time","play fair","tidy up","practise","exercise"],
      tip:"主語 students（複數）→ <b>are on time</b>。" },
    { id:"x5", topic:"sent", unit:"2",
      before:"Many sea animals are ", after:" by plastic rings and fishing nets.",
      answer:"trapped",
      pool:["endangered","vulnerable","extinct","threatened","illegal","captured"],
      tip:"被膠圈／漁網困住 → <b>trapped</b>。" },
    { id:"x6", topic:"sent", unit:"1",
      before:"She wants to ", after:" so she studies hard every day.",
      answer:"go to university",
      pool:["receive an award","play fair","tidy up","build confidence","stay organised","reflect on progress"],
      tip:"升讀大學 → <b>go to university</b>。" },
    { id:"x7", topic:"sent", unit:"2",
      before:"Whales are a kind of ", after:" — they feed their babies with milk.",
      answer:"mammal",
      pool:["species","habitat","shelter","reptile","amphibian","subject"],
      tip:"哺乳動物 → <b>mammal</b>。" },
    { id:"x8", topic:"sent", unit:"1",
      before:"I ", after:" English speaking with my classmate after school.",
      answer:"practise",
      pool:["practice","exercise","play fair","tidy up","pollute","capture"],
      tip:"動詞練習 → <b>practise</b>（港式拼法）。" },
    { id:"x9", topic:"habits", unit:"1",
      before:"Turning off my phone helps me avoid any ", after:" while doing homework.",
      answer:"distraction", letter:"c",
      tip:"令人分心嘅嘢 → <b>distraction</b>。" },
    { id:"x10", topic:"habits", unit:"1",
      before:"Writing in a ", after:" every night helps me remember what I learned.",
      answer:"journal", letter:"g",
      tip:"日記本 → <b>journal</b>。" },
    { id:"x11", topic:"habits", unit:"1",
      before:"A ", after:" helps you believe in yourself even when work is hard.",
      answer:"positive mindset", letter:"f",
      tip:"正面心態 → <b>positive mindset</b>。" },
    { id:"x12", topic:"sent", unit:"2",
      before:"The rainforest is an important ", after:" for monkeys and colourful birds.",
      answer:"habitat",
      pool:["shelter","species","environment","routine","subject","journal"],
      tip:"天然棲息地 → <b>habitat</b>。" }
  ];

  // Fix x2 - remove broken item, keep x2b
  ITEMS = ITEMS.filter(function (it) { return it.id !== "x2"; });

  var TOPICS = {
    all: { name: "全部混合", icon: "🎲", desc: "句子填空 + 學習習慣片語" },
    sent: { name: "Unit 1+2 句子", icon: "📝", desc: "Section A 生字填空（要變詞形）" },
    habits: { name: "Unit 1 學習習慣", icon: "💪", desc: "Section B：self-care、journal…" }
  };

  var ROUND = 15, MAX_RETRY = 2;
  var GOOD = ["🌟 好叻呀！", "🎉 完全正確！", "💯 犀利！", "🚀 勁呀！", "👏 Excellent!", "😎 Well done!"];
  var BAD = ["💪 唔緊要，睇吓提示！", "🙂 差少少！記住呢個分別啦！", "🌱 錯咗先學得識！", "🤗 加油！"];

  function $(id) { return document.getElementById(id); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function show(id) { ["home","quiz","finish"].forEach(function(s){ $(s).classList.toggle("hidden", s !== id); }); window.scrollTo(0,0); }
  function norm(s) { return String(s).toLowerCase().replace(/\s+/g," ").trim(); }

  function buildChoices(it) {
    var opts = [it.answer];
    if (it.topic === "habits") {
      var phrases = shuffle(BANK_B.map(function (b) { return b.phrase; }));
      for (var i = 0; i < phrases.length && opts.length < 6; i++) {
        if (norm(phrases[i]) !== norm(it.answer) && opts.indexOf(phrases[i]) < 0) opts.push(phrases[i]);
      }
    } else {
      var pool = shuffle((it.pool || []).slice());
      for (var j = 0; j < pool.length && opts.length < 6; j++) {
        if (norm(pool[j]) !== norm(it.answer) && opts.indexOf(pool[j]) < 0) opts.push(pool[j]);
      }
      var keys = shuffle(Object.keys(VOCAB));
      for (var k = 0; k < keys.length && opts.length < 6; k++) {
        if (norm(keys[k]) !== norm(it.answer) && opts.indexOf(keys[k]) < 0) opts.push(keys[k]);
      }
    }
    return shuffle(opts);
  }

  /** Render blank: revealed is boolean; text always comes from answer string — never put a boolean in the blank. */
  function renderSentence(it, revealed, cls, wrongWord) {
    var show = revealed === true;
    var c = "blank" + (cls ? " " + cls : "") + (show || wrongWord ? " filled" : "");
    var text;
    if (wrongWord) text = String(wrongWord);
    else if (show) text = String(it.answer);
    else text = "______";
    $("sentence").innerHTML = (it.before || "") + '<span class="' + c + '">' + text + "</span>" + (it.after || "");
  }

  // Speech
  var synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
  var voice = null;
  function pickVoice() {
    if (!synth) return;
    var vs = synth.getVoices() || [];
    for (var i = 0; i < vs.length; i++) if (/^en/i.test(vs[i].lang)) { voice = vs[i]; if (/en-GB/i.test(vs[i].lang)) break; }
  }
  if (synth) {
    pickVoice();
    if (synth.addEventListener) synth.addEventListener("voiceschanged", pickVoice);
    else synth.onvoiceschanged = pickVoice;
  }
  function speak(it, revealed) {
    // Before answer: insert "blank" so the spoken sentence does not spoil the answer.
    if (!synth) return;
    if (!voice) pickVoice();
    var gap = revealed ? String(it.answer) : "blank";
    var full = (it.before || "") + gap + (it.after || "");
    synth.cancel();
    var u = new SpeechSynthesisUtterance(full);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-GB";
    u.rate = 0.85;
    setTimeout(function () { synth.speak(u); }, 40);
  }

  var S = null;

  ["all","sent","habits"].forEach(function (k) {
    var g = TOPICS[k], b = document.createElement("button");
    b.className = "topic" + (k === "all" ? " mix" : "");
    b.innerHTML = '<span class="ti">' + g.icon + "</span>" + g.name + '<div class="desc">' + g.desc + "</div>";
    b.addEventListener("click", function () { start(k); });
    $("topics").appendChild(b);
  });

  function poolFor(group) {
    if (group === "all") return ITEMS.slice();
    return ITEMS.filter(function (it) { return it.topic === group; });
  }

  function start(group) {
    var pool = shuffle(poolFor(group));
    var n = Math.min(ROUND, pool.length);
    var qs = pool.slice(0, n).map(function (it) {
      return { item: it, attempt: 0, choices: buildChoices(it) };
    });
    S = { group: group, queue: qs, current: null, done: 0, stars: 0, streak: 0, best: 0,
          stats: { sent: { total: 0, ok: 0 }, habits: { total: 0, ok: 0 } }, missed: {}, totalFirst: n };
    show("quiz"); next();
  }

  function updateBar() {
    var total = S.done + S.queue.length + (S.current ? 1 : 0);
    $("progTxt").textContent = "第 " + Math.min(S.done + 1, total) + " / " + total + " 題";
    $("bar").style.width = Math.round(S.done / total * 100) + "%";
    $("stars").textContent = S.stars; $("streak").textContent = S.streak;
  }

  function next() {
    S.current = S.queue.shift() || null;
    if (!S.current) { finish(); return; }
    var q = S.current, it = q.item;
    S.answered = false;
    if (q.attempt === 0) S.stats[it.topic].total++;
    $("tag").textContent = (it.topic === "habits" ? "💪 學習習慣" : "📝 句子填空") + (it.unit ? " · Unit " + it.unit : "");
    $("retryTag").classList.toggle("hidden", q.attempt === 0);
    if (it.topic === "habits") {
      $("bank").innerHTML = "<b>Word bank：</b> " + BANK_B.map(function (b) { return b.letter + ". " + b.phrase; }).join("　");
      $("bank").classList.remove("hidden");
    } else $("bank").classList.add("hidden");
    renderSentence(it, false, "");
    $("fb").textContent = ""; $("fb").className = "fb"; $("why").innerHTML = "";
    $("nextBtn").classList.add("hidden");
    var box = $("choices"); box.innerHTML = "";
    q.choices.forEach(function (w) {
      var b = document.createElement("button");
      b.className = "choice";
      b.textContent = w;
      b.setAttribute("data-ans", w);
      b.addEventListener("click", function () { choose(w, b); });
      box.appendChild(b);
    });
    updateBar();
  }

  function choose(word, btn) {
    if (S.answered) return;
    S.answered = true;
    var q = S.current, it = q.item;
    var correct = norm(word) === norm(it.answer);
    Array.prototype.forEach.call($("choices").children, function (c) {
      c.disabled = true;
      if (norm(c.getAttribute("data-ans")) === norm(it.answer)) c.classList.add("right");
    });
    if (correct) {
      btn.classList.add("right");
      renderSentence(it, true, "right");
      if (q.attempt === 0) { S.stars++; S.stats[it.topic].ok++; }
      S.streak++; if (S.streak > S.best) S.best = S.streak;
      $("fb").className = "fb good";
      $("fb").innerHTML = pick(GOOD) + (S.streak >= 3 ? " 🔥 連續 " + S.streak + " 題！" : "");
      confetti(S.streak >= 5 ? 12 : 6);
      speak(it, true);
    } else {
      btn.classList.add("wrong");
      renderSentence(it, false, "wrong", word);
      S.streak = 0;
      S.missed[it.answer] = (S.missed[it.answer] || 0) + 1;
      $("fb").className = "fb bad";
      $("fb").innerHTML = pick(BAD) + '<div style="margin-top:6px;color:#2e7d32">正確答案：<b>' + it.answer + "</b>" +
        (it.letter ? "（" + it.letter + "）" : "") + "</div>";
      var tip = it.tip || "";
      var mean = zhOf(it.answer);
      var wrongZh = zhOf(word);
      $("why").innerHTML = '<div class="why">💡 ' + tip +
        (mean ? '<div class="mean" style="margin-top:6px"><b>' + it.answer + "</b> = " + mean + (enOf(it.answer) ? " · " + enOf(it.answer) : "") + "</div>" : "") +
        (wrongZh ? '<div class="mean">你揀咗 <b>' + word + "</b> = " + wrongZh + "</div>" : "") +
        "</div>";
      setTimeout(function () { if (S.current === q) renderSentence(it, true, "right"); }, 700);
      if (q.attempt < MAX_RETRY) {
        var sim = findSimilar(it);
        if (sim) S.queue.push({ item: sim, attempt: q.attempt + 1, choices: buildChoices(sim) });
      }
    }
    S.done++;
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").textContent = S.queue.length ? "下一題 ➡️" : "睇成績 🏆";
    updateBar();
  }

  function findSimilar(it) {
    var used = {};
    if (S.current) used[S.current.item.id] = true;
    S.queue.forEach(function (q) { used[q.item.id] = true; });
    var sameAns = ITEMS.filter(function (x) { return norm(x.answer) === norm(it.answer) && !used[x.id]; });
    if (sameAns.length) return pick(sameAns);
    var sameTopic = ITEMS.filter(function (x) { return x.topic === it.topic && !used[x.id]; });
    return sameTopic.length ? pick(sameTopic) : null;
  }

  function finish() {
    show("finish");
    var pct = S.totalFirst ? S.stars / S.totalFirst : 0;
    $("finEmoji").textContent = pct === 1 ? "🏆" : pct >= 0.8 ? "🥇" : pct >= 0.6 ? "🥈" : "💪";
    $("finTitle").textContent = pct === 1 ? "全部一次答啱！超級犀利！" : pct >= 0.8 ? "好叻呀！差少少就滿分！" : pct >= 0.6 ? "唔錯呀！繼續努力！" : "完成咗！多睇生字一定進步！";
    $("finSummary").innerHTML = "⭐ " + S.stars + " / " + S.totalFirst + " 題一次答啱　🔥 最高連續 " + S.best + " 題";
    var rows = "";
    ["sent","habits"].forEach(function (t) {
      var s = S.stats[t]; if (!s.total) return;
      rows += "<tr><td>" + (t === "sent" ? "📝 句子" : "💪 學習習慣") + "</td><td>" + s.total + "</td><td>" + s.ok + "</td></tr>";
    });
    $("sumTable").innerHTML = "<tr><th>主題</th><th>題數</th><th>一次答啱</th></tr>" + rows;
    var box = $("missedBox"); box.innerHTML = "";
    var keys = Object.keys(S.missed);
    if (!keys.length) box.innerHTML = '<p style="text-align:center;color:#2e7d32;font-weight:bold">🥇 Perfect！</p>';
    else {
      box.innerHTML = '<p style="font-weight:bold;color:#e65100">📝 要多練習：</p>';
      keys.forEach(function (w) {
        var d = document.createElement("div"); d.className = "missed";
        d.innerHTML = "<b>" + w + "</b> " + zhOf(w) + " <small>（錯 " + S.missed[w] + " 次）</small>";
        box.appendChild(d);
      });
    }
    confetti(pct >= 0.8 ? 30 : 10);
  }

  function confetti(n) {
    var icons = ["🎉","⭐","🌟","🎊","📚","✏️","🌈"];
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span"); s.className = "confetti";
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = (1.4 + Math.random() * 2) + "s";
      document.body.appendChild(s);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4000); })(s);
    }
  }

  $("againBtn").addEventListener("click", function () { start(S.group); });
  $("backBtn").addEventListener("click", function () { show("home"); });
  $("homeBtn").addEventListener("click", function () { if (confirm("要返回主頁嗎？今輪進度會冇咗。")) show("home"); });
  $("nextBtn").addEventListener("click", next);
  $("speakBtn").addEventListener("click", function () { if (S && S.current) speak(S.current.item, S.answered); });
  document.addEventListener("keydown", function (e) {
    if ($("quiz").classList.contains("hidden") || !S || !S.current) return;
    if (e.key === "Enter" && S.answered) { e.preventDefault(); next(); return; }
    if (!S.answered && /^[1-6]$/.test(e.key)) {
      var b = $("choices").children[+e.key - 1]; if (b) b.click();
    }
  });

  window.__VR = {
    ITEMS: ITEMS, BANK_B: BANK_B, VOCAB: VOCAB, buildChoices: buildChoices,
    start: start, state: function () { return S; }, poolFor: poolFor
  };
})();
</script>
</body>
</html>

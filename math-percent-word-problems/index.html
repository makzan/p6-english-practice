<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小六數學 百分數應用題 練習</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 14px;
    font-family: "Arial Rounded MT Bold", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 45%, #84fab0 100%);
    background-attachment: fixed; color: #263238;
  }
  h1 { text-align: center; font-size: clamp(1.3rem, 5vw, 2.1rem); color: #1b5e20; text-shadow: 2px 2px 0 #fff; margin: 6px 0 2px; }
  .sub { text-align: center; color: #2e7d32; margin: 0 0 14px; font-size: 1.05rem; }
  .card { background: #fff; border-radius: 26px; max-width: 760px; margin: 0 auto; padding: 20px 18px 24px; box-shadow: 0 10px 28px rgba(0,80,40,.22); border: 5px solid #ffd54f; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  /* fractions */
  .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; margin: 0 .1em; font-size: .85em; line-height: 1.1; }
  .fr .fn { border-bottom: .09em solid currentColor; padding: 0 .18em .04em; }
  .fr .fd { padding: .04em .18em 0; }
  .num { white-space: nowrap; display: inline-flex; align-items: center; }
  .mw { margin-right: .04em; }
  .op { margin: 0 .12em; color: #d81b60; font-weight: bold; }
  .par { color: #6a1b9a; font-weight: bold; }
  /* home */
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-top: 10px; }
  .topic { background: #f1f8e9; border-radius: 20px; padding: 18px 12px; font-size: 1.2rem; font-weight: bold; color: #1b5e20; box-shadow: 0 6px 0 #aed581; transition: transform .1s; }
  .topic .ti { font-size: 2.4rem; display: block; margin-bottom: 4px; }
  .topic:active { transform: translateY(4px); box-shadow: 0 2px 0 #aed581; }
  .topic.mix { background: #fff3e0; box-shadow: 0 6px 0 #ffb74d; color: #e65100; grid-column: 1 / -1; font-size: 1.45rem; }
  .intro { font-size: 1.08rem; line-height: 1.7; background: #e8f5e9; border-radius: 16px; padding: 10px 14px; }
  /* quiz */
  .topbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { background: #e8f5e9; border-radius: 999px; padding: 6px 12px; font-weight: bold; color: #1b5e20; font-size: 1rem; }
  .pill.star { background: #fff8e1; color: #f57f17; }
  .pill.fire { background: #fbe9e7; color: #d84315; }
  .homebtn { background: #eceff1; border-radius: 999px; padding: 6px 12px; font-size: 1rem; }
  .bar { flex: 1 1 100%; height: 14px; background: #e0e0e0; border-radius: 999px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #66bb6a, #26c6da); transition: width .4s; }
  .tag { display: inline-block; background: #7e57c2; color: #fff; border-radius: 12px; padding: 4px 12px; font-size: .95rem; }
  .retry { display: inline-block; background: #ffca28; color: #6d4c00; border-radius: 12px; padding: 4px 10px; font-size: .9rem; margin-left: 6px; }
  .prompt { font-size: 1.3rem; margin: 12px 0 6px; line-height: 1.5; }
  .expr { font-size: clamp(1.8rem, 7.5vw, 2.8rem); font-weight: bold; text-align: center; margin: 10px 0; color: #0d47a1; line-height: 1.6; overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
  .figbox { text-align: center; margin: 8px 0; }
  svg.fig { width: min(320px, 85%); height: auto; max-height: 260px; }
  svg.fig .sh { fill: #9e9e9e; stroke: #212121; stroke-width: 2; stroke-linejoin: round; }
  svg.fig .un { fill: #fff; stroke: #212121; stroke-width: 2; stroke-linejoin: round; }
  .hint { text-align: center; color: #6d4c41; background: #fff8e1; border-radius: 12px; padding: 6px 10px; margin: 6px auto; font-size: 1.05rem; max-width: 520px; }
  .mcq { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  .opt { background: #e3f2fd; color: #0d47a1; font-size: clamp(1.4rem, 6vw, 2rem); font-weight: bold; border-radius: 18px; padding: 16px 8px; min-height: 84px; box-shadow: 0 6px 0 #90caf9; }
  .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 #90caf9; }
  .opt.right { background: #c8e6c9; box-shadow: 0 6px 0 #66bb6a; color: #1b5e20; }
  .opt.wrong { background: #ffcdd2; box-shadow: 0 6px 0 #e57373; color: #b71c1c; }
  .opt:disabled { cursor: default; }
  /* keypad */
  .ansrow { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px 0 4px; }
  .kfrac { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .kline { width: 120px; height: 5px; background: #37474f; border-radius: 3px; }
  .kbox { min-width: 110px; height: 64px; border: 4px dashed #90a4ae; border-radius: 14px; font-size: 2rem; font-weight: bold; color: #0d47a1; background: #fafafa; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  .kbox.w { min-width: 90px; height: 80px; }
  .kbox.act { border: 4px solid #ff7043; background: #fff3e0; box-shadow: 0 0 0 4px rgba(255,112,67,.2); }
  .kbox:empty::after { content: attr(data-ph); color: #b0bec5; font-size: 1rem; font-weight: normal; }
  .ktip { text-align: center; color: #78909c; font-size: .95rem; margin-bottom: 8px; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 380px; margin: 0 auto; }
  .key { background: #ede7f6; color: #4527a0; font-size: 1.8rem; font-weight: bold; border-radius: 16px; padding: 12px 0; box-shadow: 0 5px 0 #b39ddb; }
  .key:active { transform: translateY(3px); box-shadow: 0 2px 0 #b39ddb; }
  .key.fn { background: #eceff1; color: #455a64; font-size: 1.25rem; box-shadow: 0 5px 0 #b0bec5; }
  .big { display: block; margin: 14px auto 0; font-size: 1.45rem; font-weight: bold; color: #fff; border-radius: 20px; padding: 14px 30px; min-width: 220px; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .submit { background: #43a047; }
  .next { background: #fb8c00; }
  .feedback { text-align: center; font-size: 1.35rem; font-weight: bold; margin-top: 12px; min-height: 1.5em; }
  .feedback.good { color: #2e7d32; }
  .feedback.bad { color: #c62828; }
  .feedback.info { color: #ef6c00; font-size: 1.15rem; }
  .why { background: #fff3e0; border-left: 6px solid #ff9800; border-radius: 10px; padding: 8px 12px; margin: 10px 0; font-size: 1.1rem; }
  .solution { background: #f3e5f5; border-radius: 16px; padding: 10px 14px; margin-top: 12px; }
  .solution h3 { margin: 4px 0 8px; color: #6a1b9a; font-size: 1.15rem; }
  .step { padding: 6px 0; border-bottom: 1px dashed #ce93d8; }
  .step:last-child { border-bottom: none; }
  .snote { color: #8e24aa; font-size: .98rem; }
  .shtml { font-size: 1.45rem; color: #263238; line-height: 1.8; overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .sdetail { font-size: 1.2rem; color: #455a64; background: #fff; border-radius: 8px; padding: 2px 8px; display: inline-block; margin-top: 2px; line-height: 1.7; }
  .linkbtn { background: none; color: #6a1b9a; text-decoration: underline; font-size: 1.05rem; display: block; margin: 8px auto 0; }
  /* finish */
  table.sum { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 1.05rem; }
  table.sum th, table.sum td { padding: 8px 6px; text-align: center; border-bottom: 2px solid #e0e0e0; }
  table.sum th { background: #e8f5e9; color: #1b5e20; }
  .bigemoji { font-size: 4rem; text-align: center; animation: bounce 1s infinite; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .row .big { margin: 10px 0 0; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
  .pop { animation: pop .3s ease; }
  .confetti { position: fixed; top: -30px; font-size: 1.7rem; pointer-events: none; animation: fall linear forwards; z-index: 99; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .6; } }
  @media (max-width: 420px) { .kbox { min-width: 90px; height: 56px; font-size: 1.7rem; } .key { font-size: 1.6rem; } }

  .problem { font-size: clamp(1.2rem, 4.6vw, 1.55rem); line-height: 1.7; background: #fffde7; border-radius: 16px; padding: 12px 14px; margin: 10px 0; border: 3px dashed #ffd54f; }
  .problem b { color: #c62828; }
  .stephead { font-size: 1.2rem; font-weight: bold; color: #4527a0; margin: 14px 0 6px; }
  .stephead .num1 { display: inline-block; background: #7e57c2; color: #fff; border-radius: 50%; width: 1.6em; height: 1.6em; line-height: 1.6em; text-align: center; margin-right: 6px; }
  .flist { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .flist { grid-template-columns: 1fr; } }
  .fopt { background: #ede7f6; color: #311b92; font-size: clamp(1.15rem, 4.6vw, 1.5rem); font-weight: bold; border-radius: 16px; padding: 14px 8px; min-height: 64px; box-shadow: 0 5px 0 #b39ddb; }
  .fopt:active { transform: translateY(3px); box-shadow: 0 2px 0 #b39ddb; }
  .fopt.right, .opt.right { background: #c8e6c9; box-shadow: 0 5px 0 #66bb6a; color: #1b5e20; }
  .fopt.wrong, .opt.wrong { background: #ffcdd2; box-shadow: 0 5px 0 #e57373; color: #b71c1c; }
  .fopt:disabled, .opt:disabled { cursor: default; }
  .opt { font-size: clamp(1.25rem, 5vw, 1.7rem); min-height: 70px; }
  .tipbtn { background: #fff3e0; color: #e65100; border-radius: 999px; padding: 8px 16px; font-size: 1.05rem; font-weight: bold; box-shadow: 0 4px 0 #ffcc80; }
  .diagram { background: #fafafa; border: 2px solid #e0e0e0; border-radius: 14px; padding: 8px; margin: 10px 0; text-align: center; }
  .diagram svg.seg { width: 100%; max-width: 640px; height: auto; font-family: inherit; }
  .diagram .rule { font-size: 1.1rem; color: #6a1b9a; font-weight: bold; margin-top: 4px; }
  .chosen { text-align: center; font-size: 1.5rem; font-weight: bold; color: #311b92; background: #ede7f6; border-radius: 12px; padding: 6px; margin-bottom: 8px; }
  .fb { text-align: center; font-size: 1.25rem; font-weight: bold; margin-top: 10px; min-height: 1.4em; }
  .fb.good { color: #2e7d32; } .fb.bad { color: #c62828; }
</style>
</head>
<body>
<h1>📏 小六數學：百分數應用題 🧩</h1>
<div class="sub">先揀啱列式，再計出答案！</div>

<div class="card" id="home">
  <div class="intro">
    🧠 每題分<b>兩步</b>：① 揀正確列式　② 計出答案。<br>
    💡 唔肯定？撳「睇線段圖」幫你諗！<br>
    ✅ 兩步都一次答啱有 ⭐；❌ 答錯會睇到步驟，之後再出一條類似題。<br>
    📌 口訣：<b>單位“1” × 百分率 = 所求量</b>　|　<b>已知量 ÷ 對應百分率 = 單位“1”</b>
  </div>
  <div class="topics" id="topics"></div>
</div>

<div class="card hidden" id="quiz">
  <div class="topbar">
    <button class="homebtn" id="homeBtn">🏠 返回</button>
    <span class="pill" id="progTxt"></span>
    <span class="pill star">⭐ <span id="stars">0</span></span>
    <span class="pill fire">🔥 <span id="streak">0</span></span>
    <div class="bar"><div id="bar"></div></div>
  </div>
  <div><span class="tag" id="tag"></span><span class="retry hidden" id="retryTag">🔁 再試類似題</span></div>
  <div class="problem" id="problem"></div>
  <button class="tipbtn" id="tipBtn">💡 睇線段圖</button>
  <div class="diagram hidden" id="diagram"></div>

  <div class="stephead"><span class="num1">1</span>揀正確列式</div>
  <div class="flist" id="formulas"></div>
  <div class="fb" id="fb1"></div>
  <div id="why1"></div>

  <div id="part2" class="hidden">
    <div class="stephead"><span class="num1">2</span>計出答案</div>
    <div class="chosen" id="chosen"></div>
    <div class="mcq" id="answers"></div>
    <div class="fb" id="fb2"></div>
    <div id="why2"></div>
    <button class="linkbtn hidden" id="showSolBtn">📖 睇計算步驟</button>
    <div class="solution hidden" id="solution"></div>
    <button class="big next hidden" id="nextBtn">下一題 ➡️</button>
  </div>
</div>

<div class="card hidden" id="finish">
  <div class="bigemoji" id="finEmoji">🏆</div>
  <h2 style="text-align:center;color:#4527a0;margin:6px 0" id="finTitle">完成！</h2>
  <p style="text-align:center;font-size:1.2rem" id="finSummary"></p>
  <table class="sum" id="sumTable"></table>
  <div class="row">
    <button class="big submit" id="againBtn">🔄 再玩一次</button>
    <button class="big next" id="backBtn">🏠 揀其他主題</button>
  </div>
</div>
<script>
var MathCore = (function () {
  "use strict";
  // ---------- random helpers ----------
  var rand = Math.random;
  function setRandom(fn) { rand = fn; }
  function rnd(a, b) { return a + Math.floor(rand() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
  function chance(p) { return rand() < p; }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function wpick(items) {
    var tot = 0, i;
    for (i = 0; i < items.length; i++) tot += items[i][0];
    var r = rand() * tot;
    for (i = 0; i < items.length; i++) { r -= items[i][0]; if (r < 0) return items[i][1]; }
    return items[items.length - 1][1];
  }
  function nonMult(lo, hi, m) { var k; do { k = rnd(lo, hi); } while (k % m === 0); return k; }

  // ---------- exact fractions ----------
  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = a % b; a = b; b = t; } return a; }
  function lcm(a, b) { return a / gcd(a, b) * b; }
  function Frac(n, d) {
    if (d === undefined) d = 1;
    if (!Number.isInteger(n) || !Number.isInteger(d)) throw new Error("non-integer " + n + "/" + d);
    if (d === 0) throw new Error("division by zero");
    if (d < 0) { n = -n; d = -d; }
    var g = gcd(n, d) || 1;
    this.n = n / g; this.d = d / g;
    if (!Number.isSafeInteger(this.n) || !Number.isSafeInteger(this.d)) throw new Error("overflow");
  }
  function F(n, d) { return new Frac(n, d); }
  Frac.prototype.add = function (o) { return F(this.n * o.d + o.n * this.d, this.d * o.d); };
  Frac.prototype.sub = function (o) { return F(this.n * o.d - o.n * this.d, this.d * o.d); };
  Frac.prototype.mul = function (o) { return F(this.n * o.n, this.d * o.d); };
  Frac.prototype.div = function (o) { if (o.n === 0) throw new Error("division by zero"); return F(this.n * o.d, this.d * o.n); };
  Frac.prototype.eq = function (o) { return this.n === o.n && this.d === o.d; };
  Frac.prototype.isInt = function () { return this.d === 1; };
  Frac.prototype.isTerm = function () { var d = this.d; while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; };
  Frac.prototype.decPlaces = function () { if (!this.isTerm()) return Infinity; var p = 1, k = 0; while (p % this.d !== 0) { p *= 10; k++; } return k; };
  Frac.prototype.toNumber = function () { return this.n / this.d; };
  Frac.prototype.toString = function () { return this.d === 1 ? String(this.n) : this.n + "/" + this.d; };
  var HUNDRED = F(100);

  function decStr(f) {
    if (!f.isTerm()) throw new Error("not terminating: " + f);
    var k = f.decPlaces(), p = Math.pow(10, k);
    var N = f.n * (p / f.d), neg = N < 0;
    var s = String(Math.abs(N));
    if (k > 0) { while (s.length <= k) s = "0" + s; s = s.slice(0, s.length - k) + "." + s.slice(s.length - k); }
    return (neg ? "−" : "") + s;
  }

  // ---------- HTML rendering ----------
  function fracH(n, d) { return '<span class="fr"><span class="fn">' + n + '</span><span class="fd">' + d + '</span></span>'; }
  function mixedH(f) {
    var sign = f.n < 0 ? "−" : "", n = Math.abs(f.n), d = f.d;
    if (d === 1) return sign + n;
    var w = Math.floor(n / d), r = n - w * d;
    return '<span class="num">' + sign + (w ? '<span class="mw">' + w + '</span>' : "") + fracH(r, d) + '</span>';
  }
  function improperH(f) { return f.d === 1 ? String(f.n) : (f.n < 0 ? "−" : "") + fracH(Math.abs(f.n), f.d); }
  function pctH(f) { var P = f.mul(HUNDRED); return (P.isTerm() ? decStr(P) : mixedH(P)) + "%"; }
  function pctMixedH(f) { return mixedH(f.mul(HUNDRED)) + "%"; }
  function decH(f) { return decStr(f); }
  var OPH = { "+": "+", "−": "−", "×": "×", "÷": "÷" };

  function fmtDec(v) { return v.isTerm() && v.decPlaces() <= 6 ? decStr(v) : null; }
  function fmtPct(v) {
    var P = v.mul(HUNDRED);
    if (P.isTerm()) return P.decPlaces() <= 4 ? decStr(P) + "%" : null;
    return P.d <= 1000 ? mixedH(P) + "%" : null;
  }

  // ---------- options ----------
  function opt(vOrFn, fmtFn, why) {
    try {
      var v = typeof vOrFn === "function" ? vOrFn() : vOrFn;
      if (!v) return null;
      var h = fmtFn(v);
      if (h == null) return null;
      return { v: v, html: h, why: why || "" };
    } catch (e) { return null; }
  }
  function buildOptions(correct, cands, fallback) {
    var opts = [correct];
    function ok(c) {
      if (!c || !c.v || c.html == null) return false;
      if (c.v.n <= 0) return false;
      for (var i = 0; i < opts.length; i++) if (opts[i].v.eq(c.v) || opts[i].html === c.html) return false;
      return true;
    }
    var i;
    for (i = 0; i < cands.length && opts.length < 4; i++) if (ok(cands[i])) opts.push(cands[i]);
    for (i = 0; i < fallback.length && opts.length < 4; i++) if (ok(fallback[i])) opts.push(fallback[i]);
    if (opts.length < 4) throw new Error("not enough options");
    correct.correct = true;
    return shuffle(opts);
  }
  function deltaFallback(ans, deltas, fmtFn) {
    var out = [];
    deltas.forEach(function (d) {
      out.push(opt(function () { return ans.add(d); }, fmtFn, ""));
      out.push(opt(function () { return ans.sub(d); }, fmtFn, ""));
    });
    return shuffle(out);
  }
  function coprimeNum(d) { var n; do { n = rnd(1, d - 1); } while (gcd(n, d) !== 1); return n; }
  function properFrac(dens) { var d = pick(dens); return F(coprimeNum(d), d); }
  function step(note, html, detail) { return { note: note || "", html: html, detail: detail || "" }; }

  var TOPICS = {
    p2f: { name: "百分數 → 最簡分數", icon: "🍕" },
    f2p: { name: "分數 → 百分數", icon: "💯" },
    p2d: { name: "百分數 → 小數", icon: "🔽" },
    d2p: { name: "小數 → 百分數", icon: "🔼" },
    eq: { name: "邊個數值相等？", icon: "⭐" },
    fig: { name: "著色圖形", icon: "🥧" },
    calc: { name: "四則混合計算", icon: "🧮" }
  };

  // ======================================================
  // 1. % -> simplest fraction (keypad)
  // ======================================================
  function genP2F() {
    for (var tries = 0; tries < 100; tries++) {
      var kind = pick(["int", "int", "big", "dec1", "dec1", "dec2", "frac", "frac"]);
      var P, disp, steps = [];
      if (kind === "int") P = F(nonMult(1, 99, 100));
      else if (kind === "big") P = F(pick([110, 120, 125, 140, 150, 175, 180, 225, 245, 250, 290, 320, 350, 375, 412]));
      else if (kind === "dec1") P = F(chance(0.5) ? pick([125, 375, 625, 875, 25, 75, 54, 45, 15, 35, 175, 225, 62, 48, 12, 5]) : nonMult(1, 999, 10), 10);
      else if (kind === "dec2") P = F(pick([8, 25, 4, 5, 12, 16, 75, 125, 2, 45, 36, 64]), 100);
      else { var c = pick([3, 3, 6, 7, 9, 3]); var b = coprimeNum(c); var w = chance(0.75) ? rnd(1, 66) : 0; P = F(w * c + b, c); }
      var ans = P.div(HUNDRED);

  // ======================================================
  // 7. mixed calculations
  // ======================================================
  function N(v, f) { return { k: "n", v: v, f: f }; }
  function O(op, a, b, p) { return { k: "o", op: op, a: a, b: b, p: !!p }; }

  function ltrEval(tk) { var acc = tokVal(tk[0], ltrEval); for (var i = 1; i < tk.length; i += 2) acc = apply(tk[i], acc, tokVal(tk[i + 1], ltrEval)); return acc; }

      else { ops.push(op); vals.push(v); }
    }

  function partDiagram(sub, n, ctx, fam, knownTotal, X, solveUnit) {

  // ---------- generators ----------

  function pickRates(sub) {

  function useText(kind, sub, ctx, n, X) {

  function genPartUnit(kind, sub) {

            { t: O("÷", num(X), R.remain2(n.a, n.b)), why: "第二次係「餘下的」" + n.b + "%，要分兩步：÷ (1 − " + n.b + "%) ÷ (1 − " + n.a + "%)。" },
            { t: O("×", O("×", num(X), R.remain(n.a)), R.remain(n.b)), why: "原有（單位“1”）未知，要用 ÷ 倒推返去！" },
            { t: O("÷", O("÷", num(X), pc(n.a)), pc(n.b)), why: "已知嘅係「餘下」，要對應 (1 − %)。" },

          { t: O("÷", O("÷", num(Wt), R.remain(n.a)), pc(n.b)), why: ctx.A + "原有嘅數量已知，求餘下要用 × (1 − " + n.a + "%)。" },
          { t: O("÷", num(Wt), pc(n.b)), why: "要先計" + ctx.A + "餘下幾多：× (1 − " + n.a + "%)。" }
        ];

    part: [[1, "single"], [1.2, "remain"], [1, "sum"], [1.5, "diff"], [1.2, "remain2"]],

})();

  var ROUND = 12, MAX_RETRY = 2;
  var GOOD1 = ["👍 列式正確！", "🎯 列式啱晒！", "😎 識得分析！"];
  var GOOD2 = ["🌟 好叻呀！", "🎉 完全正確！", "💯 犀利！", "🚀 勁呀！", "🧠 應用題高手！"];
  var BAD = ["💪 唔緊要，睇吓點解！", "🙂 差少少！", "🌱 錯咗先學得識！", "🤗 加油！"];
  function $(id) { return document.getElementById(id); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function show(id) { ["home", "quiz", "finish"].forEach(function (s) { $(s).classList.toggle("hidden", s !== id); }); window.scrollTo(0, 0); }
  var S = null;

  ["mix", "part", "unit", "cmp", "chal"].forEach(function (k) {
    var g = WP.GROUPS[k], b = document.createElement("button");
    b.className = "topic" + (k === "mix" ? " mix" : "");
    b.innerHTML = '<span class="ti">' + g.icon + "</span>" + g.name + (g.desc ? '<div style="font-size:.85rem;font-weight:normal;margin-top:4px">' + g.desc + "</div>" : "");
    b.addEventListener("click", function () { start(k); });
    $("topics").appendChild(b);
  });

  function start(groupKey) {
    var qs;
    try { qs = WP.buildRound(groupKey, ROUND); } catch (e) { alert("出題出錯，請再試一次"); return; }
    S = { group: groupKey, queue: qs, current: null, done: 0, stars: 0, streak: 0, best: 0, stats: {} };
    show("quiz"); next();
  }
  function stat(t) { return S.stats[t] || (S.stats[t] = { total: 0, perfect: 0, wf: 0, wa: 0 }); }
  function updateBar() {
    var total = S.done + S.queue.length + (S.current ? 1 : 0);
    $("progTxt").textContent = "第 " + Math.min(S.done + 1, total) + " / " + total + " 題";
    $("bar").style.width = Math.round(S.done / total * 100) + "%";
    $("stars").textContent = S.stars; $("streak").textContent = S.streak;
  }
  function setDiagram(open) {
    var q = S.current;
    $("diagram").innerHTML = q.diagram + '<div class="rule">📌 ' + q.tip + "</div>";
    $("diagram").classList.toggle("hidden", !open);
    $("tipBtn").textContent = open ? "🙈 收起線段圖" : "💡 睇線段圖";
  }

  function next() {
    S.current = S.queue.shift() || null;
    if (!S.current) { finish(); return; }
    var q = S.current;
    q.attempt = q.attempt || 0; q.ok1 = null; q.ok2 = null; q.done = false;
    if (q.attempt === 0) stat(q.topic).total++;
    $("tag").textContent = WP.TOPICS[q.topic].icon + " " + WP.TOPICS[q.topic].name;
    $("retryTag").classList.toggle("hidden", q.attempt === 0);
    $("problem").innerHTML = q.text;
    setDiagram(false);
    ["fb1", "fb2"].forEach(function (id) { $(id).textContent = ""; $(id).className = "fb"; });
    $("why1").innerHTML = ""; $("why2").innerHTML = "";
    $("part2").classList.add("hidden");
    $("solution").classList.add("hidden"); $("solution").innerHTML = "";
    $("showSolBtn").classList.add("hidden"); $("nextBtn").classList.add("hidden");
    var box = $("formulas"); box.innerHTML = "";
    var longest = Math.max.apply(null, q.formulas.map(function (f) { return f.html.replace(/<[^>]+>/g, "").length; }));
    box.style.gridTemplateColumns = longest > 20 ? "1fr" : "";
    q.formulas.forEach(function (f) {
      var b = document.createElement("button");
      b.className = "fopt"; b.innerHTML = f.html; f.btn = b;
      b.addEventListener("click", function () { chooseFormula(f); });
      box.appendChild(b);
    });
    updateBar();
  }

  function chooseFormula(f) {
    var q = S.current;
    if (q.ok1 !== null) return;
    q.ok1 = !!f.correct;
    q.formulas.forEach(function (x) { x.btn.disabled = true; if (x.correct) x.btn.classList.add("right"); });
    if (f.correct) { $("fb1").className = "fb good"; $("fb1").innerHTML = pick(GOOD1); }
    else {
      f.btn.classList.add("wrong");
      $("fb1").className = "fb bad"; $("fb1").innerHTML = pick(BAD) + " 正確列式係：" + q.formulaH;
      $("why1").innerHTML = '<div class="why">💡 ' + f.why + "</div>";
      setDiagram(true);
      stat(q.topic).wf++;
    }
    $("chosen").innerHTML = q.formulaH + " = ？";
    var box = $("answers"); box.innerHTML = "";
    q.answers.forEach(function (a) {
      var b = document.createElement("button");
      b.className = "opt"; b.innerHTML = a.html; a.btn = b;
      b.addEventListener("click", function () { chooseAnswer(a); });
      box.appendChild(b);
    });
    $("part2").classList.remove("hidden");
    setTimeout(function () { if ($("part2").scrollIntoView) $("part2").scrollIntoView({ behavior: "smooth", block: "nearest" }); }, 50);
  }

  function chooseAnswer(a) {
    var q = S.current;
    if (q.ok2 !== null || q.ok1 === null) return;
    q.ok2 = !!a.correct;
    q.answers.forEach(function (x) { x.btn.disabled = true; if (x.correct) x.btn.classList.add("right"); });
    var perfect = q.ok1 && q.ok2;
    if (a.correct) {
      $("fb2").className = "fb good";
      $("fb2").innerHTML = (perfect ? pick(GOOD2) : "✔ 答案啱咗！") + " 答：<b>" + q.answerH + "</b>";
      $("showSolBtn").classList.remove("hidden");
    } else {
      a.btn.classList.add("wrong");
      $("fb2").className = "fb bad"; $("fb2").innerHTML = pick(BAD) + " 正確答案：<b>" + q.answerH + "</b>";
      if (a.why) $("why2").innerHTML = '<div class="why">💡 ' + a.why + "</div>";
      stat(q.topic).wa++;
      renderSolution();
    }
    if (perfect) {
      if (q.attempt === 0) { stat(q.topic).perfect++; S.stars++; }
      S.streak++; if (S.streak > S.best) S.best = S.streak;
      if (S.streak >= 3) $("fb2").innerHTML += " 🔥 連續 " + S.streak + " 題！";
      confetti(S.streak >= 5 ? 16 : 8);
    } else {
      S.streak = 0;
      if (q.attempt < MAX_RETRY) { try { var nq = q.regen(); nq.attempt = q.attempt + 1; S.queue.push(nq); } catch (e) { /* ignore */ } }
    }
    S.done++;
    $("nextBtn").classList.remove("hidden");
    $("nextBtn").textContent = S.queue.length ? "下一題 ➡️" : "睇成績 🏆";
    updateBar();
  }

  function renderSolution() {
    var q = S.current, h = "<h3>📖 計算步驟</h3>";
    q.steps.forEach(function (s) {
      h += '<div class="step">' + (s.note ? '<div class="snote">▶ ' + s.note + "</div>" : "") + '<div class="shtml">' + s.html + "</div>" + (s.detail ? '<div class="sdetail">' + s.detail + "</div>" : "") + "</div>";
    });
    h += '<div class="step"><div class="snote">▶ 作答</div><div class="shtml">答：' + q.answerH + "</div></div>";
    $("solution").innerHTML = h; $("solution").classList.remove("hidden"); $("showSolBtn").classList.add("hidden");
  }

  $("tipBtn").addEventListener("click", function () { setDiagram($("diagram").classList.contains("hidden")); });
  $("showSolBtn").addEventListener("click", renderSolution);
  $("nextBtn").addEventListener("click", next);
  $("homeBtn").addEventListener("click", function () { if (confirm("要返回主頁嗎？今輪進度會冇咗。")) show("home"); });
  $("againBtn").addEventListener("click", function () { start(S.group); });
  $("backBtn").addEventListener("click", function () { show("home"); });
  document.addEventListener("keydown", function (e) {
    if ($("quiz").classList.contains("hidden") || !S || !S.current) return;
    var q = S.current;
    if (e.key === "Enter" && q.ok2 !== null) { e.preventDefault(); next(); return; }
    if (/^[1-4]$/.test(e.key)) { var i = +e.key - 1; if (q.ok1 === null) chooseFormula(q.formulas[i]); else if (q.ok2 === null) chooseAnswer(q.answers[i]); }
  });

  function finish() {
    show("finish");
    var tq = 0, tp = 0, rows = "";
    Object.keys(WP.TOPICS).forEach(function (t) {
      var s = S.stats[t]; if (!s) return;
      tq += s.total; tp += s.perfect;
      rows += "<tr><td>" + WP.TOPICS[t].icon + " " + WP.TOPICS[t].name + "</td><td>" + s.total + "</td><td>" + s.perfect + "</td><td>" + s.wf + "</td><td>" + s.wa + "</td></tr>";
    });
    $("sumTable").innerHTML = "<tr><th>主題</th><th>題數</th><th>一次全對</th><th>列式錯</th><th>答案錯</th></tr>" + rows;
    var pct = tq ? tp / tq : 0;
    $("finEmoji").textContent = pct === 1 ? "🏆" : pct >= 0.8 ? "🥇" : pct >= 0.6 ? "🥈" : "💪";
    $("finTitle").textContent = pct === 1 ? "全部一次答啱！超級犀利！" : pct >= 0.8 ? "好叻呀！差少少就滿分！" : pct >= 0.6 ? "唔錯呀！繼續努力！" : "完成咗！多練幾次一定會進步！";
    $("finSummary").innerHTML = "⭐ " + S.stars + " / " + tq + " 題兩步都一次答啱　🔥 最高連續 " + S.best + " 題";
    confetti(pct >= 0.8 ? 40 : 15);
  }
  function confetti(n) {
    var icons = ["🎉", "⭐", "🌟", "🎊", "💯", "🧩", "🌈"];
    for (var i = 0; i < n; i++) {
      var s = document.createElement("span"); s.className = "confetti";
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = (1.4 + Math.random() * 2) + "s";
      document.body.appendChild(s);
      (function (el) { setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 4000); })(s);
    }
  }
  window.__app = { start: start, state: function () { return S; }, chooseFormula: chooseFormula, chooseAnswer: chooseAnswer };
})();
</script>
